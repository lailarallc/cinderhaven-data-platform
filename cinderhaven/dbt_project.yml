name: 'cinderhaven'
version: '1.0.0'
config-version: 2

profile: 'cinderhaven'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Grants (plan U4; roles in sql/truth_roles.sql): the reader and validator roles
# read every model the dbt role builds. +grants covers the relations; schema
# USAGE is granted after the run, for each schema the run built.
on-run-end:
  - "{% for s in schemas %}grant usage on schema {{ s }} to cinderhaven_reader, cinderhaven_validator;{% endfor %}"

models:
  cinderhaven:
    +grants:
      select: ['cinderhaven_reader', 'cinderhaven_validator']
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
