# The committed dbt profile (plan U4, egress path 5): every connection value
# from the environment, so the role is set by whoever runs it, not by a
# machine-local ~/.dbt file. CI's dbt-quarantine job connects through it as a
# member of cinderhaven_dbt. Nothing here is a secret.
cinderhaven:
  target: default
  outputs:
    default:
      type: postgres
      host: "{{ env_var('CINDERHAVEN_PG_HOST') }}"
      port: "{{ env_var('CINDERHAVEN_PG_PORT') | int }}"
      user: "{{ env_var('CINDERHAVEN_PG_USER') }}"
      password: "{{ env_var('CINDERHAVEN_PG_PASSWORD') }}"
      dbname: "{{ env_var('CINDERHAVEN_PG_DB', 'cinderhaven') }}"
      schema: public
      threads: 4
