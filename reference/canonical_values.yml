absent:
  households: {status: absent, reason: 'no table, no column in the warehouse'}
  panel_projection_factor_k: {status: absent, reason: 'no table, no column'}
  competitive_snapshots: {status: absent, reason: 'no table'}
  acv: {status: not_derivable, reason: 'needs all-commodity store volume, absent. distribution.pct_authorized_selling and distribution.voids_authorized_not_scanned are proxies under their OWN names, NOT acv'}
  accounts_payable: {status: absent_structural, reason: 'all 294 supplier invoices carry a paid_date; no open payable at any snapshot. DPO is the meaningful figure. Distinct from no-column.'}
  accounts_receivable: {status: absent_structural, reason: 'schema has no aging/receivable concept; uncollected receivables are $0 by construction (Phase 1). Distinct from no-column.'}

