# --- SUPERSEDES: retired figures/strings that must never appear in current
# source or rendered output. The verify run writes each `token` (one per line)
# to reference/supersedes.txt; the per-repo drift gate greps source + rendered
# output against that file and FAILS the build on any hit, excluding history /
# SUPERSEDES docs and per-repo allowlisted legitimate uses.
#
# Tokens are the FORMATTED renderings a surface would actually emit — never a
# bare integer. A bare "461" collides with substrings of live values (checked:
# 461/296/430/5.4 all appear inside current canon numbers), so each retired
# figure is retired in every rendering a repo might use (comma form, no-comma
# form used in code, and the $X.XM/$XXXK prose form).
#
# The full narrative dictionary (~40 entries, with the WHY for each) lives in
# the human view reference/CINDERHAVEN_CANONICAL.md § SUPERSEDES. This block is
# the machine-greppable subset: high-confidence tokens safe to fail a build on.
supersedes:
  # Brand / entity errors
  - {token: 'Cinderhaven Foods', reason: 'brand name error; the brand is Cinderhaven Provisions'}
  - {token: 'Wegmans', reason: 'never a contracted retailer (roster: Walmart, Costco, Whole Foods, Sprouts, Kroger, Regional Group). Allowlist real-retailer deduction-practice research docs.'}
