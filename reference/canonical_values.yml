# Cinderhaven canonical values — MACHINE-READABLE SSOT
# Keyed metric.basis.period. The human view is reference/CINDERHAVEN_CANONICAL.md;
# both are the SAME values. verify_canonical.py reads THIS file, not the prose.
#
# VERIFIED-AGAINST-PRODUCTION 2026-07-29 via read-only workflow run 30488858977
# (dispatch-only, Fly Postgres cinderhaven-db). Query source: sql/canonical_gather.sql.
#
# PERIODS: cy2023/cy2024/cy2025 = calendar years; trailing_12m == cy2025 in this
# dataset (scan ends 2025-12-27); trailing_24m = 2024-2025; trailing_36m = 2023-2025.
# DEFAULT: an unqualified "annual" means cy2025. Every other period is a NAMED variant,
# not a discrepancy. Prior canonical figures were silently trailing_36m — see the .md.

