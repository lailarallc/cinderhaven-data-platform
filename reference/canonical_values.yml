fulfillment:
  # --- OTIF pair: anchored 2026-09-17 (was the second blind spot) ---
  # The homepage (lailara-website) rendered a retired 95%/86% pair for three
  # months while the otif tool rendered 99%/84%, and the drift gate could not
  # catch it because neither figure was in this file: the .md carried the pair
  # (99.2% / 84.5%, tuned 2026-06-20) but the yml did not, and the gate reads
  # the yml. Values below were RECOMPUTED 2026-09-17 from the otif-blind-spot
  # pipeline's read-only pull of live Fly Postgres (scripts/cache/
  # platform_fulfillment.json, pulled 2026-06-30, after the 06-20 tuning) using
  # the tool's own scoring (scripts/02_export_json.py). Cross-check: the pull's
  # 46,760 shipments equal data_windows.retailer_orders (verified against
  # production 2026-07-29). NOT yet emitted by canonical_gather.sql -- fold it in
  # on the next production run, as with price_history.
  #
  # DEFINITIONS (the tool's, verbatim):
  #   fill_rate_internal_pct  = units shipped / units ordered, ALL retailer
  #                             shipments, measured at the brand's dock.
  #   otif_walmart_pct        = share of Walmart shipments both on time
  #                             (delivered <= requested_ship_date + 3d MABD) and
  #                             in full (units RECEIVED >= units ordered) --
  #                             the retailer's dock, not the brand's.
  #   on_time / in_full       = the two components; the gap is ~85% in-full.
  #   otif_portfolio_pct      = same scoring, all six retailers.
  #   gap_walmart_pts         = fill_rate_internal_pct - otif_walmart_pct.
  # PERIODS by po_date. full_corpus = all 46,760 rows incl. 112 orders dated
  # 2026-01-01..02 (the orders tail) -- it is what otif.lailarallc.com renders
  # (99.2% / 84.5% / 14.8 pts) and what the .md documents. Every period rounds
  # to the same integer pair, so marketing copy renders "99% / 84%".
  # Walmart's own goals for context (8th & Walton, as of 2024-03): 95% in-full
  # for all suppliers; 90% on-time prepaid / 98% on-time collect; miss = 3% of
  # COGS on the failing cases, billed quarterly. 84% is penalty territory, not
  # an automatic delisting -- that conversation belongs to the merchant team.
