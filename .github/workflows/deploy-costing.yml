name: Rebuild production from DDL (seed_all.py)

# The contract (plan U2; rewritten from the 2026-06 costing-only deploy):
#
#   This job rebuilds production from DDL with generation/seed_all.py, ONCE,
#   in U12, as part of the relock. It drops and recreates raw, costing,
#   copack's five seeded tables, truth and the public_* schemas, then builds
#   every dbt model. Production is a publication: the class-A consumers in
#   the spec's CONSUMER-READ-MAP read it live.
#
#   Until U12 the first step refuses. U12 removes that step in the commit that
#   dispatches the rebuild, so opening the job is one reviewed line, not an
#   input anyone can tick. No step connects to anything before it
#   (tests/test_generation_paths.py).
#
# DISPATCH ONLY. Never on push, never on schedule.
#
# Gates after the refusal:
#   - Step 0, sql/drop_guard.sql: populated raw, costing, copack or truth
#     refuses unless force_recreate; a relation the platform does not define,
#     or a raw table whose columns differ from the pre-regen reference,
#     refuses whatever force_recreate says, unless LEFTOVER names it.
#   - Step 3: production's post-rebuild hashes must equal the off-host
#     world's manifest (reference/offhost_world_manifest.json, committed in
#     U12). The published world is the tested world.
#
# Production's logins for this job are U12's; PGUSER below is the pre-U12
# shape and never runs while the refusal stands.

on:
  workflow_dispatch:
    inputs:
      force_recreate:
        description: "Drop populated raw/costing/copack/truth (DESTRUCTIVE). Overrides nothing else."
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-costing-production
  cancel-in-progress: false

env:
  # sql/raw_schema.sql at the last platform commit before U8's first DDL edit
  # (plan U2). Production has not been rebuilt since, so its raw tables equal
  # this reference. Named here, in a reviewed line, not as a dispatch input.
  RAW_REFERENCE_COMMIT: 934785e
  # Consumer-written relations U19 moves before the relock, comma-separated
  # schema.relation. Empty until U12 fills it from the read map.
  LEFTOVER: ""

jobs:
  rebuild:
    runs-on: ubuntu-latest
    services:
      # A scratch instance, never production: the guard's reference columns
      # and expected relations come from the DDL applied here, not a parser.
      scratch:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust  # throwaway, empty, reachable from this runner only
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: cinderhaven
      PGPASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    steps:
      # ── THE PRE-RELOCK REFUSAL ────────────────────────────────────
      # First step, ahead of the proxy and everything that connects.
      # U12 deletes this step in the commit that dispatches the rebuild.
      - name: "Refuse: production is rebuilt once, in U12"
        run: |
          echo "::error::Production is rebuilt from DDL once, in U12, with the relock. This step refuses every dispatch until U12 removes it in a reviewed commit."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Step 0 reads sql/raw_schema.sql at RAW_REFERENCE_COMMIT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"  # one version for the baseline, the unified run and U12 (spec DECISIONS#u2-one-python)

      - name: Install deps
        run: |
          pip install -r requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # ── STEP 0 — the drop guard ───────────────────────────────────
      - name: "Step 0a: guard inputs from the DDL and dbt's manifest (scratch instance)"
        env:
          SCRATCH: host=localhost port=55432 user=postgres dbname=postgres
          PGPASSWORD: ""  # production's is never offered to the scratch instance
          # dbt parse reads the committed profile but connects to nothing.
          CINDERHAVEN_PG_HOST: localhost
          CINDERHAVEN_PG_PORT: "55432"
          CINDERHAVEN_PG_USER: postgres
          CINDERHAVEN_PG_PASSWORD: unused
        run: |
          set -euo pipefail
          COLS="SELECT coalesce(json_object_agg(relname, cols), '{}') FROM (
                  SELECT c.relname, json_agg(a.attname ORDER BY a.attnum) AS cols
                  FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                  JOIN pg_attribute a ON a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped
                  WHERE n.nspname = 'raw' AND c.relkind = 'r' GROUP BY c.relname) t"
          git show "$RAW_REFERENCE_COMMIT:sql/raw_schema.sql" | psql "$SCRATCH" -q -v ON_ERROR_STOP=1
          psql "$SCRATCH" -tAc "$COLS" > /tmp/raw_reference.json
          psql "$SCRATCH" -q -v ON_ERROR_STOP=1 -f sql/raw_schema.sql
          psql "$SCRATCH" -tAc "SELECT string_agg('raw.' || relname, ',') FROM pg_class c
                                JOIN pg_namespace n ON n.oid = c.relnamespace
                                WHERE n.nspname = 'raw' AND c.relkind = 'r'" > /tmp/expected_raw.txt
          (cd cinderhaven && dbt parse --profiles-dir ../orchestration -q)
          python -c "
          import json
          nodes = json.load(open('cinderhaven/target/manifest.json'))['nodes'].values()
          print(','.join(sorted(f\"{n['schema']}.{n.get('alias') or n['name']}\" for n in nodes
                if n['resource_type'] in ('model', 'seed', 'snapshot')
                and n['config'].get('materialized') != 'ephemeral')))" > /tmp/expected_dbt.txt
          echo "reference tables: $(python -c "import json; print(len(json.load(open('/tmp/raw_reference.json'))))")"
          echo "expected: $(tr ',' '\n' < /tmp/expected_raw.txt | wc -l) raw, $(tr ',' '\n' < /tmp/expected_dbt.txt | wc -l) dbt"

      - name: Open proxy to production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl proxy 5432:5432 -a cinderhaven-db &
          for i in $(seq 1 30); do
            (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1 && break
            sleep 1
          done
          pg_isready -h localhost -p 5432

      - name: "Step 0b: sql/drop_guard.sql (zero rows = pass)"
        run: |
          set -euo pipefail
          {
            echo '\o /dev/null'
            printf "SELECT set_config('drop_guard.force_recreate', %s, false);\n" "'${{ inputs.force_recreate }}'"
            printf "SELECT set_config('drop_guard.expected', %s, false);\n" "\$g\$$(cat /tmp/expected_raw.txt),$(cat /tmp/expected_dbt.txt)\$g\$"
            printf "SELECT set_config('drop_guard.raw_reference', %s, false);\n" "\$g\$$(cat /tmp/raw_reference.json)\$g\$"
            printf "SELECT set_config('drop_guard.leftover', %s, false);\n" "\$g\$${LEFTOVER}\$g\$"
            echo '\o'
          } > /tmp/guard_inputs.sql
          # Unpiped: psql's own exit code gates the step (FAILURES.md, 2026-11-11).
          psql -q -v ON_ERROR_STOP=1 -tA -f /tmp/guard_inputs.sql -f sql/drop_guard.sql > /tmp/guard_out.txt
          grep -v '^$' /tmp/guard_out.txt > /tmp/refusals.txt || true
          if [ -s /tmp/refusals.txt ]; then
            echo "::error::The drop guard refused:"; cat /tmp/refusals.txt; exit 1
          fi
          echo "Drop guard: no refusals."

      # ── STEP 1 — the dated record of the flat world ───────────────
      - name: "Step 1: production's world hashes before the rebuild (a record, not an invariant)"
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tA -F'|' -f sql/world_hashes.sql > /tmp/before.txt
          echo "=== PRODUCTION BEFORE THE REBUILD ($(date -u +%F)) ==="
          cat /tmp/before.txt

      # ── STEP 2 — the rebuild ──────────────────────────────────────
      - name: "Step 2: generation/seed_all.py (DDL, generators, dbt build, verify_counts)"
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/cinderhaven
          ALLOW_PROD_DB: "1"  # this step, and no other, writes production on purpose; see generation/prod_guard.py
        run: python generation/seed_all.py

      # ── STEP 3 — the published world is the tested world ──────────
      - name: "Step 3: post-rebuild hashes against the off-host manifest"
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tA -F'|' -f sql/world_hashes.sql > /tmp/after.txt
          python -c "
          import json, sys
          want = {t['table']: (t['rows'], t['hash']) for t in json.load(open('reference/offhost_world_manifest.json'))['tables']}
          got = {l.split('|')[0]: (int(l.split('|')[1]), l.split('|')[2]) for l in open('/tmp/after.txt').read().split()}
          bad = sorted(t for t in want.keys() | got.keys() if want.get(t) != got.get(t))
          for t in bad: print(f'{t}: production {got.get(t)}, off-host {want.get(t)}')
          sys.exit(1 if bad else 0)"
          echo "All $(wc -l < /tmp/after.txt) generated tables equal the off-host manifest."

      # ── STEP 4 — integrity ────────────────────────────────────────
      - name: "Step 4: costing integrity suite (zero rows = pass)"
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -tA -f tests/test_costing_integrity.sql > /tmp/integrity.txt
          if [ -s /tmp/integrity.txt ]; then
            echo "::error::Integrity failures:"; cat /tmp/integrity.txt; exit 1
          fi
          echo "Integrity suite: no failing checks."
