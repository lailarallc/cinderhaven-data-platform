name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dbt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dbt
        run: pip install dbt-core dbt-postgres

      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          cinderhaven:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: public
                threads: 1
          EOF

      - name: Validate project structure
        working-directory: cinderhaven
        run: dbt parse

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Pinned to the versions the Dagster guard test's faked manifest is
          # proven on; unpinned, dagster-dbt 0.29.29 + dbt-core 1.12 reject it.
          pip install ./orchestration "dagster==1.13.4" "dagster-dbt==0.29.4" "dbt-core==1.11.9"

      # Fast tier: no test here connects to a database (`db` marker excluded).
      # A skip fails the run (tests/skip_is_failure.py), so the Dagster guard
      # test runs rather than skipping.
      - name: Fast test tier
        run: python -m pytest -m "not db"
