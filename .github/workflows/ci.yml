name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Plan U4: the truth quarantine's database tier, on a throwaway service
  # container that holds no truth rows. Roles as the bootstrap superuser (the
  # one administrator connection CI keeps), DDL as a generator login, dbt as a
  # dbt-role login through the committed profile, then the lineage checks on
  # the real project and on a copy with violating models planted.
  dbt-quarantine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinderhaven
          POSTGRES_USER: ci_admin
          POSTGRES_PASSWORD: ci-throwaway-${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_admin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: cinderhaven
      CINDERHAVEN_PG_HOST: localhost
      CINDERHAVEN_PG_PORT: "5432"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate this run's test logins
        run: |
          for v in GEN_PW DBT_PW READ_PW; do
            pw=$(openssl rand -hex 20); echo "::add-mask::$pw"; echo "$v=$pw" >> "$GITHUB_ENV"
          done

      - name: Apply the roles as the bootstrap superuser
        env:
          PGUSER: ci_admin
          PGPASSWORD: ci-throwaway-${{ github.run_id }}
        run: |
          psql -v ON_ERROR_STOP=1 -q -f sql/truth_roles.sql
          psql -v ON_ERROR_STOP=1 -q -c "CREATE ROLE ci_generator LOGIN PASSWORD '$GEN_PW' IN ROLE cinderhaven_generator"
          psql -v ON_ERROR_STOP=1 -q -c "CREATE ROLE ci_dbt LOGIN PASSWORD '$DBT_PW' IN ROLE cinderhaven_dbt"
          psql -v ON_ERROR_STOP=1 -q -c "CREATE ROLE ci_reader LOGIN PASSWORD '$READ_PW' IN ROLE cinderhaven_reader"

      - name: Apply the schema DDL as the generator
        env:
          PGUSER: ci_generator
        run: |
          export PGPASSWORD="$GEN_PW"
          for f in sql/raw_schema.sql sql/costing_schema.sql sql/truth_schema.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          DATABASE_URL="host=localhost port=5432 dbname=cinderhaven user=ci_generator password=$GEN_PW" \
            python -c "import sys; sys.path.insert(0, 'generation'); import os, psycopg2, seed_void_patterns as v
          c = psycopg2.connect(os.environ['DATABASE_URL']); v.seed_addresses(c.cursor()); c.commit()"

      - name: dbt compile and run as the dbt role, through the committed profile
        working-directory: cinderhaven
        env:
          CINDERHAVEN_PG_USER: ci_dbt
        run: |
          export CINDERHAVEN_PG_PASSWORD="$DBT_PW"
          dbt run --profiles-dir ../orchestration
          dbt compile --profiles-dir ../orchestration

      - name: Lineage walk and compiled-SQL scan on the real project
        run: python quarantine/dbt_lineage.py cinderhaven/target

      - name: The same checks fail on a copy with a truth bypass and a literal planted
        env:
          CINDERHAVEN_PG_USER: ci_dbt
        run: |
          export CINDERHAVEN_PG_PASSWORD="$DBT_PW"
          cp -r cinderhaven /tmp/planted && rm -rf /tmp/planted/target
          for planted in mart_innocuous_bypass mart_literal_truth; do
            rm -rf /tmp/run && cp -r /tmp/planted /tmp/run
            cp tests/fixtures/dbt_lineage/sources_truth.yml /tmp/run/models/staging/sources_truth.yml
            cp "tests/fixtures/dbt_lineage/$planted.sql" /tmp/run/models/marts/
            (cd /tmp/run && dbt compile --profiles-dir "$GITHUB_WORKSPACE/orchestration" -q)
            if python quarantine/dbt_lineage.py /tmp/run/target; then
              echo "::error::dbt_lineage passed with $planted planted"; exit 1
            fi
            echo "$planted: caught"
          done

      - name: "Egress path 1: the dump runs as a reader, names its schemas, ships no truth"
        run: |
          PGUSER=ci_generator PGPASSWORD="$GEN_PW" psql -v ON_ERROR_STOP=1 -q -f tests/fixtures/egress/probe_truth_row.sql
          export SKIP_PROXY=1 DUMP_HOST=localhost DUMP_PORT=5432 DUMP_USER=ci_reader PGUSER=ci_reader PGPASSWORD="$READ_PW"
          DUMP_FILE=/tmp/dump.sql bash scripts/dump_flyio.sh
          grep -q "CREATE TABLE raw.stores" /tmp/dump.sql
          python -c "from quarantine.text_scan import assert_no_truth_text; assert_no_truth_text('/tmp/dump.sql')"
          if grep -Eiq '^CREATE SCHEMA (IF NOT EXISTS )?"?truth"?;' /tmp/dump.sql; then echo "::error::dump creates truth"; exit 1; fi
          # Listed, truth is still excluded: the script ships none of it.
          DUMP_SCHEMAS="raw truth" DUMP_FILE=/tmp/dump_truth.sql bash scripts/dump_flyio.sh
          python -c "from quarantine.text_scan import assert_no_truth_text; assert_no_truth_text('/tmp/dump_truth.sql')"
          # With the exclusion gone, the role still holds: a reader cannot dump truth.
          if pg_dump --schema=truth --no-owner --no-privileges -f /tmp/bare.sql; then
            echo "::error::a reader dumped truth"; exit 1
          fi
          echo "a reader's dump of truth fails on permission, as it must"

      - name: "Egress path 1: init-db.sh refuses a truth dump; a clean dump restores with no truth"
        env:
          PGUSER: ci_admin
          PGPASSWORD: ci-throwaway-${{ github.run_id }}
        run: |
          echo 'CREATE SCHEMA truth;' > /tmp/bad.sql
          if DUMP_FILE=/tmp/bad.sql bash scripts/init-db.sh; then echo "::error::init-db.sh restored a truth dump"; exit 1; fi
          createdb restore_probe
          # The runner's pg_dump (17) writes SET transaction_timeout, which the 16 server rejects.
          sed '/transaction_timeout/d' /tmp/dump.sql > /tmp/dump16.sql
          psql -v ON_ERROR_STOP=1 -q -d restore_probe -f /tmp/dump16.sql > /dev/null
          test "$(psql -tA -d restore_probe -c "SELECT count(*) FROM pg_namespace WHERE nspname = 'truth'")" = "0"
          echo "clean dump restored; no truth schema"

      - name: Database tier with no world (roles, apply script)
        env:
          HARNESS_PG_HOST: localhost
          HARNESS_PG_PORT: "5432"
          HARNESS_PG_DB: cinderhaven
          HARNESS_PG_USER: ci_admin
          HARNESS_PG_PASSWORD: ci-throwaway-${{ github.run_id }}
        run: python -m pytest -m db tests/test_truth_roles.py tests/test_apply_truth_roles.py tests/test_consumer_credentials.py

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # Pinned to the versions the Dagster guard test's faked manifest is
          # proven on; unpinned, dagster-dbt 0.29.29 + dbt-core 1.12 reject it.
          pip install ./orchestration "dagster==1.13.4" "dagster-dbt==0.29.4" "dbt-core==1.11.9"

      # Fast tier: no test here connects to a database (`db` marker excluded).
      # A skip fails the run (tests/skip_is_failure.py), so the Dagster guard
      # test runs rather than skipping.
      - name: Fast test tier
        run: python -m pytest -m "not db"
