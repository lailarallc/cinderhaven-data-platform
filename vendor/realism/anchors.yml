    fees; UNFI 2% and KeHE 3% of shorted value (A5.15). The escalation that is real is the CONSEQUENCE TIER - corrective
    action plan, reduced orders, delist - and it is carried by the per-account consequence rows rather than by any
    fine schedule. The tolerance line''s financial signature is therefore fine dollars per month rising with depth,
    printed by scripts/group10_floors.py from A5.11 and A5.15. CROSS-CHECK INTO GROUP 4, REPORTED NOT FIXED: at
    the registered rates and A5.11''s y3 performance, late and OTIF fines derive to $0.1484M - Walmart $0.0953M,
    Kroger $0.0207M, UNFI $0.0125M, KeHE $0.0105M, Costco $0.00643M, Regional $0.00302M - which is 5.29% of the $2.80M y3 operational pool (A4.01 alone, the base A4.05''s mix splits; owner, 2026-11-06). RESTATED 2026-09-17 on the registered account mix, with KeHE at the registered 9%; 2026-09-24 on A5.38''s
    UNFI line; and 2026-10-01 on U4''s cascade (DECISIONS#u4-cascade), which reads A5.11''s exact in-full and caps
    lateness at A5.07''s five days at every account. THE REBALANCE IS SIGNED AND THE MECHANISM CONFIRMS IT: A4.05''s
    late/OTIF share moved to 5% on 2026-09-12, and 5% of the operational pool is $0.140M against the derived $0.1484M - a ratio of 0.94x, the mechanisms 6% above the registered share (restated 2026-11-06 onto A4.01 alone, U14 batch 8; it read 1.06x on the bucket pool from 2026-10-19). The rebalance went to short_ship (26) and pricing_error (11). BOTH INPUTS THAT BLOCKED A POINT ESTIMATE
    ARE NOW SIGNED. Walmart''s on-time and in-full misses are INDEPENDENT (owner-signed 2026-09-12): nothing registered
    gives a late shipment a different case count, the seeder generates per shipment and the fine follows the cases
    on it, and the realised correlation is reported as an OUTPUT rather than assumed a second time. That holds the
    non-compliant case share at 25.6% and Walmart''s fine at $0.0953M; the correlated and mutually exclusive readings
    give $0.1201M and $0.1546M, and the row prints the band. Kroger''s days past the window are GEOMETRIC with mean
    1.5 (band 1-3, owner-signed). LATENESS AT EVERY ACCOUNT, owner-signed practitioner 2026-10-01: days past each
    account''s window are geometric, with means Walmart 1.2, on a tight MABD window; Kroger 1.5; Regional 2.5, on
    a loose window; and every other account Kroger''s 1.5 until a window is registered for it. A5.07''s five-day
    cap binds at EVERY account: a PO more than five days past its window is a retailer cancel inside A5.07''s 1.0%,
    ships nothing and earns no fine at all, neither for lateness nor for short-shipping. So E[days | fined] is 1.4793
    at Kroger, 0.41% of Kroger''s late POs become cancels instead, 0.01% of Walmart''s and 7.78% of Regional''s,
    and the late cancels run 2.14 / 2.56 / 3.14 POs a year across the accounts. An agreed push-out is a reschedule,
    not lateness, and the revision rows that carry push-outs are deliberately not reused as a lateness distribution
    here. A5.11 also defines on-time on SHIPMENTS while A5.16 fines CASES, and no row carries the cases-per-shipment
    relationship for late versus on-time shipments.'
