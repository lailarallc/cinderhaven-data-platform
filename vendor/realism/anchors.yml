    and at the distributors' share
  value: 'ONE MECHANISM PER ACCOUNT (owner, 2026-09-12). At UNFI and KeHE, swell - A4.30''s 1.5-2% of distributor
    purchases, taken flat in lieu of returns - IS the damaged-and-unsaleables deduction, and at retailers damaged
    and unsaleable product arrives as itemized deductions, never as a swell allowance as well. THE FIT DEPENDS ON
    THE ALLOCATION, AND THAT IS A FINDING: brand-wide, swell of $0.0878-0.1170M in y1 is 35-46% of A4.05''s damaged/unsaleables
    type, so the type contains it; at the distributors'' own share of wholesale - the allocation A11.14 uses - swell is 1.73-2.30x the type in y1, 1.51-2.01x in y2 and 1.34-1.79x in y3. A4.30 and A4.05 agree only if retailers''
    damaged rate per dollar runs at 29-47% of the distributors'' in y1, 34-56% in y2 and 41-66% in y3 (on the registered
    account mix, the swell base at UNFI and KeHE is $8.592M and $10.512M in y2 and y3. THE MULTIPLES ABOVE DO NOT
    MOVE with the mix: swell and the type''s share scale with the same distributor share, so the ratio is invariant
    and only the levels shift). A10.06''s refunds on non-viable inventory land in the same type and are unsized.
    DTC returns stay in the existing refunds table. RULED 2026-09-15 (item 10): SWELL IS AN ALLOWANCE, NOT A DEDUCTION,
    so there is no double count and THE TWO RECONCILE BY ACCOUNT - A4.30''s swell at the distributors sits on the
    TRADE side and replaces returns there, and A4.05''s damaged and unsaleables apply at the NON-SWELL accounts.
    The multiples above are therefore not a gap to close: they set a trade allowance at two accounts against a deduction
    type spread over every account, which is the wrong comparison, and the "A4.30 and A4.05 agree only if" finding
    is WITHDRAWN with it. What survives is plausibility - were the type spread by wholesale share, the swell would run 1.34-2.30x the distributors'' portion across the window, which is the order of magnitude an allowance-for-returns
    swap implies. OWED: the percent of units returned and the returns accrual rate. The ruling''s ''1-2%'' is A4.30''s
    1.5-2%, read rather than restated.'
