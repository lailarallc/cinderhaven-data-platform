    Cinderhaven line cancels in each year. LATE CANCEL, AT EVERY ACCOUNT: a PO more
    than 5 days past its account''s late window is a retailer cancel, not a late fine; it ships nothing and earns
    no fine at all, neither for lateness nor for short-shipping. It is the cap on A10.11''s geometric lateness,
