    / $1.869M (A11.01), read by A9.01''s marketplace line. WHY IT EXISTS: item 12 put Amazon inside A8.01''s 10%
    and gave it revenue, but the cost of getting that revenue had no row. A8.10''s $52 blended CAC is an own-site
    paid-acquisition programme - it buys a customer to the brand''s own store - and a marketplace unit is not acquired
    that way. Without this row a restatement that moved the own-site 3PL onto own-site orders would have REMOVED
    cost and registered nothing in its place, and EBITDA would have turned positive in all three window years on
    a cost base known to be incomplete. It does not: with this row and A11.22''s referral fee read together, EBITDA
    was a deeper loss than before when this row was registered on 2026-09-18, not a shallower one. The P&L moved
    again the same day - A11.31''s FBA fees, the referral blended over A11.03''s pack mix and the Amazon parcel
    carved out of freight - and A9.02 carries EBITDA now. NOT TIER A, AND THE REASON IS RECORDED RATHER THAN PAPERED
