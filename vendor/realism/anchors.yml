  unit: formula
  value: 'Void pattern mix: cluster (never-scanned across a DC''s stores) 55 / scatter (isolated store-weeks) 30
    / went-dark (scanned then stopped, still authorized) 15 - cluster dominant because distribution-execution is
    the poorly-managed brand''s failure. PLANTED EPISODE COUNT = A7.14 gap rate x authorized store-SKU-weeks x
    A7.14''s supplier-caused share / mean episode duration in weeks - an output of the grid, never a round number;
    COMPUTED: a log-normal with median 5 days and 25% beyond 14 days has sigma 1.53 and MEAN 16 days (2.3 weeks -
    the tail drags the mean far above the median); gap-weeks = A7.14 rate x grid = 155K / 257K / 381K -> 25K /
    51K / 87K planted episodes per year, 0.8 / 1.1 / 1.4 per door-SKU per year. ONLY SUPPLIER-CAUSED GAPS ARE
    PLANTED (owner, 2026-11-03, DECISIONS#u14): their share of the gap-weeks is A7.14''s, 36.8 / 45.8 / 52.6%, and
    the store-caused rest, episodes of about a day, stays in the weekly not-on-shelf rate as days, because a weekly
    grid cannot hold them as events. RESTATED 2026-09-24 on the re-solved door plan, by group10_floors.void_episodes(): the grid is doors x authorized SKUs x 52 at A7.14''s 9 / 10.5 / 12%, and the per-door-SKU rate does not depend on the doors, so only the counts moved.'
  history: 'The first draft of A7.15 wrote the planted episode count as ''25-35K'' without computing it - an order of magnitude low. A7.15 gap-weeks and episodes per year on the 2026-09-05 door plan read 145K / 241K / 357K and 63K / 105K / 156K; RESTATED 2026-09-24 on the re-solved door plan to 155K / 257K / 381K and 68K / 112K / 166K. RESTATED 2026-11-03 (owner,
    DECISIONS#u14) from 68K / 112K / 166K episodes, 2.0 / 2.4 / 2.7 per door-SKU, every gap-week planted, to the
    supplier-caused episodes alone.'
