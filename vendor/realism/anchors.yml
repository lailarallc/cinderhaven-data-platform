  value: 'ONE ASIN PER SELLABLE UPC, PLUS AMAZON-ONLY MULTIPACKS - a 2-pack and a 3-pack of an existing UPC, with
    no manufacturing SKU and no catalogue row (owner, 2026-09-12). THEY ARE SINGLE-ASIN MULTIPACKS WITH THEIR OWN
    FNSKU, NOT VIRTUAL BUNDLES (owner, 2026-09-18), and this RETIRES the virtual-bundle wording this row carried
    from 2026-09-12. The distinction is not cosmetic and it was a live contradiction: an Amazon virtual bundle ships
    its components separately, so every jar would take the single''s $4.22 fulfilment fee and the single''s 8% referral
    - while A11.22 has always priced the referral as a multipack, saying a two-pack crosses $15 and pays 15% on
    its whole price. The two rows disagreed for six days and the ruling resolves it in A11.22''s favour. Priced
    both ways in y1: as multipacks $0.319M fulfilment and $0.133M referral; as virtual bundles $0.458M and $0.0780M.
    The alternative is printed beside the signed figure by group9_ledger.py''s bundle_alternative(), never folded
    into it. PACK MIX, OWNER-SIGNED 2026-09-18 and over JARS rather than orders: 20% of Amazon units move as singles,
    30% in 2-packs, 50% in 3-packs. This is the figure A11.22 recorded as owed - it is what turns the referral band
    into a rate (13.6% blended) and what decides the FBA weight band a unit takes (A11.31, $2.945 a jar). One ruling
    closes both. A2.01''s catalogue and R4''s product_master_history do not change: a bundle is a listing, not a
    product, so it cannot launch or exit, and A11.20''s survival curve never applies to it. The pack hierarchy A2.05
