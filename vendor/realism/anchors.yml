    paperboard, $0.10 for glass and for steel containers, $0.29 for PP lids and $0.38 for PP jars, to $1.38 for foamed
    polystyrene. FLAT FEES, on the same schedule under ORS 459A.884(6): a producer under $10 million in gross revenue
    supplying over five metric tons, or the reverse, may pay $1,200 at 1-2.5 t, $2,500 at 2.5-5 t, $4,100 at 5-7.5 t
    or $5,800 at 7.5-10 t, and the two lowest bands are open to producers over $10 million as well - 2026 terms,
    printed beside the window and never applied to it. THE FEE IS
    A11.25''S, at the 2025 glass rate this row reports. OTHER STATES, dated: Colorado - participation from 2025-07-01
    and registration due 2025-07-31, inside the window, fees due 2026-01-01; Minnesota - registration with CAA by 2025-07-01,
    inside, cost coverage from 2029; California SB 54 - registration by 2026-06-01 and the program from 2027-01-01; Maine
    - no fee start date as of 2026-08-20.'
