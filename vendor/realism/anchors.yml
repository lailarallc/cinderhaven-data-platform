  plausibility_anchor: A lean brand sets its standard cost once a year at most, and many leave it for years; the variance lands in PPV, where a CFO sees it and nobody at the brand reads it
  rationale: A3.01 rolls the standard at January 2023 and the package never registered what that roll produced, so the mart's cost basis was the 2025-price figure by default. Registering it makes the mart's basis a figure and the gap to the P&L a watched one.
