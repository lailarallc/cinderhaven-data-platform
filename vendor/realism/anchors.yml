  unit: count
  denominator: days past stated terms; holds as count of suppliers per window year
  value: 'THE SUPPLIER SIDE, and the one chain that runs inward. Terms are A9.11''s: ingredients net 30, glass net 45,
    co-packers net 30, AP run twice monthly on the 1st and 16th. Consequences, owner-signed practitioner: a 1.5% per month
    late fee from 30 days past due; PRIORITY LOSS at 15 days past, where the supplier ships after its on-time customers;
    CREDIT HOLD at 45 days past due or 2 missed AP runs; release on payment of past-due, with the next order on cash-in-advance
    and no separate deposit (owner, 2026-10-20, DECISIONS#u18-rulings). THE CHAIN: hold -> materials or co-packed goods
    not shipped -> production runs slip by A5.29''s lead time, co-pack for a co-packer (owner, 2026-10-21, DECISIONS#u16-lead-time)
    and in-house for the materials suppliers -> allocation_shortage cuts on every account, largest first by A5.26''s revenue-rank
    priority - the simultaneous short that makes one supplier''s hold visible at six retailers in the same week. DATED
    ON U16''S DAILY LEDGER (owner, 2026-10-22, DECISIONS#u16-daily-ledger): each invoice is paid at the AP run nearest
    its 32nd day, and a part-held run pays the oldest first. On the line''s own cash the oldest unpaid invoice runs at
    worst 29 / 48 / 79 days past terms in y1 / y2 / y3. y1 reaches PRIORITY LOSS on September 30 y1 and stops short of
    the late fee. y2 reaches priority loss on March 30 y2, the LATE FEE on August 31 y2 and THE CREDIT HOLD on November
    30 y2, during the second holiday build. THE y2 HOLD REACHES AT EVERY AP TIMING (owner, 2026-10-27, DECISIONS#u14):
    paid at the run before each invoice''s 32nd day the oldest invoice peaks at 45 days; at the run after, 52. At the
    run before, 45 days is the hold line itself, and the hold lands December 15 y2. The hold falls on every supplier
    the same day - both co-packers and the materials suppliers - because a part-held run holds the newest invoices across
    all of them: A5.30''s larger co-packer is the largest exposure, 70% of co-packed volume, not the first. The missed-runs
