  unit: pct
  denominator: new listings dropped at the first review / new listings; cumulative within 24 months
  value: '90-day velocity check: bar in units/store/week for a new item - Walmart 2.0, Kroger 1.5, Sprouts 1.2,
    Whole Foods 1.0, Regional 1.0, distributors 0.8 (cases-per-DC-week equivalents). THE POST-REVIEW DELIST RATES
    RESTATE TO WHAT DERIVES (ruled 2026-09-14): they are an output of selection, floors and cuts, not an input.
    On A5.38''s units, with A7.10''s 40% acceptance on A11.23''s signed forecast error of 0.60, an account factor
    retailers cannot forecast and no decay, 52% of new listings fail the ninety-day check - Walmart 47, Kroger 64,
    Whole Foods 46 - and 59% are delisted or cut within two years, catalogue exit included. WHAT MOVES THE 90-DAY
    SHARE IS CROSS-ACCOUNT DISPERSION OF SKU VELOCITY, NOT THE BRAND INDEX, and the counterfactuals say so rather
    than the design: on the same 6,000 seeded trials, with A7.12''s index at the category average of 100 everywhere
    the share is 53% against the same 52%, and with no account factor at all it falls to 43%. The two-year share
    behaves differently - 56% at a category-average index and 56% with no factor - because A7.12''s floors, which
    read the index, bite over two years and the 90-day bar does not. THE SHARES ARE A11.21''S OUTPUTS, printed here
    because the owner ruled that this row restates to them; this row does not depend on A11.21, and the bars are
    the only inputs it holds. THE PRACTITIONER 25% AND ~40% ARE PLAUSIBILITY, with Castellion & Markham''s review
