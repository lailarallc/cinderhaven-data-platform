  value: 'THE JANUARY 2023 STANDARD-COST ROLL, the manufactured standard the books carry for the whole window (DECISIONS#A3.01-period: rolled once, never re-rolled). ROLLED STANDARD: $2.06 a 12 oz jar, A3.01''s manufactured cost at 2025 prices times A9.16''s 2023 level relative to 2025, held to the cent because the ERP holds standard cost at two decimals (owner, 2026-10-12). The roll reads the 2023 annual level, the year the standard is set for; no month-level January 2023 reading exists, because about half A9.16''s weight maps to no named series. U14 read the named series and each reproduces A9.16''s means, so A9.16 did not move and neither this row nor A11.32 re-signs (owner-signed 2026-10-13). This is the cost the margin mart reads as cogs_per_unit; the P&L reads landed cost as it moves, and the gap is A11.32''s.'
