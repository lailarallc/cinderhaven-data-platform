  value: 'Deduction reserve: balance sheet - allowance = 60% of open deduction residuals older than 30 days plus
    100% of disputed-and-lost; written off at A4.09''s derived rate. Borrowing base - the open deduction RESIDUALS
    (the short-paid balances, $0.20 / $0.29 / $0.38M, ~45 days of the bucket pool) are 100% ineligible until cleared,
    won, or written off, and the deduction rate itself enters the DILUTION RESERVE on the advance rate (A9.14) -
    so an unfiled dispute costs the base for as long as it sits and a filed one until it is won, and every deduction
