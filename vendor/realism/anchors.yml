  plausibility_anchor: A single 12 oz jar at a sub-$10 price through FBA pays a fulfilment fee near a third of its price before referral and advertising; a brand that sells it there loses money or breaks even, and the multipack is the fix such brands rarely make
  rationale: The fee ruling put Amazon's fees in the window, and the mart's Amazon row came out negative. A band test exemption would have watched nothing, so the row's margin is registered as a derived figure with the band its inputs give, and the test holds the row to it. The two cost bases are kept because a lean brand has both; the gap between them is printed and watched.
