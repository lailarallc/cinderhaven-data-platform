  value: 'THE WALMART CHAIN, with its lags and its probability. Stage 1, fines monthly at the registered rate on
    the non-compliant cases (A5.16), which happens in every month of every window year - A5.17''s below-target shares
    are 93 / 86 / 96% in-full and 100 / 93 / 98% on-time. Stage 2, the tolerance line crossed. Stage 3, a category-review
    conversation at the next line review - line reviews run twice a year against the spring and fall modular resets,
    so the lag is 0-6 months (practitioner). Stage 4, order reduction at A5.04''s registered cut depth, median 25%
    of the line''s units (band 10-50), on the affected SKUs'' POs for one quarter - ONE COUNT READ, NOT A NEW NUMBER.
    Stage 5, delist at the next modular reset, 0-6 months. Breach to delist 9-18 months. IS IT A DRAW OR AN EVENT?
    Derived from A5.11''s on-time means and A5.17''s sd 4: the quarter mean has sd 4/sqrt(3) = 2.31, so P(a quarter
    below the 80 drop line) is 0.1% in y1, 2.6% in y2 and 19.3% in y3; two consecutive quarters 0.0 / 0.1 / 3.7%;
    at least one consecutive pair inside a year 0.0 / 0.2 / 9.8% (the three adjacent pairs in four quarters are not independent, since (Q1,Q2), (Q2,Q3) and (Q3,Q4) share quarters. The exact count of length-4 strings with no two adjacent below-line
    quarters gives q^4 + 4pq^3 + 3p^2q^2, and a 4,000,000-draw Monte Carlo returns 0.09749). THE DELIST RISK IS A y3 PHENOMENON,
    not a window-long one - it is near zero until the on-time mean reaches 82, and reporting "about 10% a year"
    across the window would overstate y1 and y2 by two orders of magnitude. WHAT THE WINDOW CARRIES WITH CERTAINTY:
    fines every month; one category-review conversation after the y2 line review; 1-2 SKUs in the reduced-order
    state after the y3 review. The delist is a registered floor in group 11''s lifecycle (owner, 2026-10-14, DECISIONS#u18-rulings Q4): the trial draws the breach at these any-pair odds and delists Walmart''s lowest-velocity carried SKU at the next modular reset, so the chain''s cause is the chain, never a velocity floor; most y3 chains land past 2025-12-31 and leave the account in the consequence state. In the recomputed trial the floor fires rarely and only in y3 (DECISIONS#u18-rulings Q4 records the rate): the window most likely shows a stage-4 consequence state and no delist, and truth carries the stage the chain reached.'
  history: 'A10.03''s y3 probability of at least one consecutive below-line pair inside a year was 10.8% until CORRECTED 2026-09-21 to 9.8%: the generator had computed it as 1 - (1 - pair)^3, treating the three adjacent pairs in four quarters as independent when (Q1,Q2), (Q2,Q3) and (Q3,Q4) share quarters. At 10.8% THE GENERATOR AND A10.03 HAD AGREED WITH EACH OTHER AND BOTH WERE WRONG, so no cross-check could see it - the figure checks compare the row to the generator and there they matched. The 2026-09-21 correction did not move y1 and y2.'
