    (owner, 2026-10-05): a kind is floored at >=1 per window YEAR at an account only in the years it expects >= 3
    there, on A5.02''s POs and A5.37''s lines (group10_floors.cancel_floor); everywhere else the floor is >=1 over
    the WINDOW, and a seed that misses is a draw, not a defect. Per year: retailer order cancels at Walmart and the
    small accounts; Cinderhaven order cancels at the small accounts, and at Walmart in y3; both line-level kinds
    at Walmart, UNFI and the small accounts, and at KeHE retailer line cancels in every year and Cinderhaven line
