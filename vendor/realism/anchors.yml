  denominator: null
  value: 'The METRIC SET IS A FLAG, NOT A LIST. survivability_check iterates the registry rows carrying
    survivability_metric: true and checks each against A10.02''s three lines; it never reads an enumeration in prose.
    The flag sits on the row that DEFINES each metric, so the metric and its definition cannot drift apart: A5.16
    (Walmart on-time prepaid, collect-ready, in-full), A5.19 (ASN/855 accuracy), A5.06 (lead-time adherence), A4.05
    (SQEP label/pallet/ASN accuracy, and invoice accuracy via pricing_error), A10.15 (FSMA ASN-KDE completeness from
    2025-08-01, OBSERVED not fined), A5.15 (fill and on-time targets for Kroger, WF, Sprouts, Regional, UNFI, KeHE,
    and Kroger''s cancel and return rates <5%), A5.35 (the scorecard metric set per account), A10.06
    (shelf-life-at-receipt >=75% and post- guaranteed-sale DC velocity), A10.05 (Costco per-PO exceptions and sales
    per club-week), A4.01 (chargeback rate by account), A4.12 (open-dispute age), A10.07 (supplier days past terms).
    TWELVE rows. The worklist''s "nine floors-table rows, never claimed exhaustive" is retired and replaced by a
    testable statement: A METRIC WITHOUT THE FLAG IS NOT CHECKED, and `python scripts/check_anchors.py` prints the
    flagged set so the list is read from the data. Adding a metric means flagging its defining row, which is one edit
    in one place.'
