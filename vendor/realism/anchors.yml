    is visible: monthly storage about $0.05 a unit at A9.12''s days of supply, $0.00542 / $0.00791 / $0.0104M; inbound
    placement about $0.27 a unit, $0.0293 / $0.0427 / $0.0561M; returnless refunds about 2% of orders, READ as the
    order''s revenue forgone since the refund gives up both the unit and the sale, $0.0195 / $0.0284 / $0.0374M. WHAT
    THIS CLOSES: until 2026-09-18 FBA fulfilment and storage were unread on every Amazon unit, and the same day''s
    restatement of A9.01''s DTC 3PL onto own-site orders had made that omission larger rather than smaller - the
