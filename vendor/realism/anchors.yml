  value: 'AMAZON''S FEES FOR A 3P/FBA SELLER - TIER A, DATED UNDER THE OWNER''S UNDATED-SOURCES RULE (2026-09-14):
    Amazon''s fee page is undated, so it is dated by its earliest Internet Archive capture showing the same figures,
    2021-05-31, and every monthly capture read inside the window, January 2023 to December 2025, carries them. THE
    RULE IS AMENDED, AND THIS ROW IS WHY (owner, 2026-09-15, item 13): captures BEFORE and AFTER the window showing
    the same figure, with no fee-change notice between them, BRACKET the window and satisfy Tier A. The earlier
    rule dated a page by its earliest capture alone, which left this row''s source_date at 2021-05-31 - outside
    the window - as the standing objection against its own tier. It qualifies on the bracket: 2021-05-31 before,
    a later capture after, and Amazon''s own notices of 2022-11-17, 2023-12-05 and 2024-11-19 changing no grocery
    rate in between. The page''s earlier address carried them from 2020-04-08; Amazon''s Seller Central schedule
    showed 15% with 8% at $15 or less as a temporary reduction from 2017-10-15, extended to 2019-12-31, and as the
    standing table rate by the capture of 2019-07-19. A11.01 holds the model. Professional selling plan $39.99 a
    month. Grocery and Gourmet referral 8% of the total sales price - item, shipping and gift wrap - at $15.00 or
    less and 15% above, no minimum; the rate applies to the whole price, not to the part above $15, so an A11.03
    two-pack priced at A3.18''s $8.99 a jar crosses $15 and pays 15% on its whole price. Amazon''s fee notices dated
    2022-11-17, 2023-12-05 and 2024-11-19 change no grocery referral rate for 2023, 2024 or 2025, and none prints
    the rate. FBA FULFILMENT CHANGED ON DATES AMAZON''S NOTICES GIVE: a new card from 2023-01-17, up $0.22 a unit
    on average; standard-size fees down $0.20 on average from 2024-04-15, with items priced under $10 keeping a
    further $0.77 discount; no increase for 2025. STORAGE per cubic foot a month, standard size, January-September:
    $0.87, then $0.78 from 2024-04-01, in Amazon''s notice. NOT REGISTERED, BECAUSE NO AMAZON SOURCE IS RECORDED
    FOR THEM: the fee for each weight band on the 2023 and 2024 cards and on the 2025 card outside the three bands
    A11.31 registers, the 2023-2025 peak-season cards (A11.31 carries the 2026 peak column from Amazon''s page and
    derives 2025''s) and the date the under-$10 discount began, read in seller-service vendors'' copies; and the
    October-December storage rate and the storage-utilization, aged-inventory and low-inventory-level fees - their
    tiers, dates and conditions - read with no source recorded. The FBA costs page the ruling names, sell.amazon.com/fulfillment-by-amazon#fba-costs,
    was not read. Which band a pack takes needs its shipping weight: A11.31 reads the owner''s pack weights, registered
    at A2.08 - the single''s 1.08 lb filled unit, as against the 0.33 lb of packaging an EPR fee reads (ruled 2026-09-15,
    item 3). A9.01 READS WHAT THIS ROW CAN GIVE IT, in its marketplace line (item 12 gave Amazon a place, closing
    A11.01''s open question; the two fees moved out of A9.02''s group-11 block on 2026-09-18): the Professional
    plan at $479.88 a year and the REFERRAL FEE on Amazon''s $0.975 / $1.422 / $1.869M. THE FLOOR RETIRES, 2026-09-18:
    A11.03''s pack mix is owner-signed at 20 / 30 / 50 over jars, so the rate blends rather than sitting at its
    bottom. Every jar carries A3.18''s $8.99, so a jar''s share of dollars is its share of units and the blend is
    0.20 x 8% + 0.80 x 15% = 13.6%, giving $132.6 / $193.4 / $254.2K. A blend over a signed mix is a figure, not
    a range. With the Professional plan at $479.88 a year the P&L reads a combined BLENDED AT 13.6%, $133.1 / $193.9
    / $254.6K. FBA FULFILMENT AND STORAGE ARE READ FROM A11.31, NOT FROM THIS ROW: A11.31 registers three large-standard
    bands of the 2025 non-peak card from Amazon''s own Seller Central page, Tier A on the 2025 fee, with the peak
    uplift, storage, inbound placement and returnless refunds at Tier B, and A9.01''s marketplace line reads every
    one of them. A9.01''s DTC 3PL line charges own-site orders only, because A11.01 decides FBA and the brand''s
    3PL never picks a marketplace order, so A11.31''s fee is what Amazon''s units pay to be fulfilled. An attempt
    to read the card on 2026-09-18 failed at the source: every route to Amazon''s rate card was refused by the working
    session''s network - sell.amazon.com, sellercentral.amazon.com, supplychain.amazon.com and the Internet Archive
    alike - so nothing was read and nothing was assumed; the owner transcribed three bands of the card the same
    day, and a local session with network access read Seller Central''s "2026 US FBA fulfillment fee changes" page
    and confirmed every figure on 2026-09-22 (A11.31). The per-unit fee is derived in A11.31, not here: A11.03''s
    owner-signed single-versus-multipack mix decides which pack, and so which weight band, a jar takes, and A11.31
    weights its three pack fees over the mix to a fee a jar. The two packs'' weights are the owner''s, registered
    at A2.08; the packaging inside them is not registered on its own, and A11.03 owes it. OWED: the FBA costs page''s
    size-tier table; the October-December storage rate and the surcharges'' rates and dates; and fees for the other
    sizes.'
  history: From 2026-09-15 to 2026-09-18 A11.22 published the referral fee at its 8% floor, $78.5K / $114.2K / $150.0K
    on Amazon's $0.975 / $1.422 / $1.869M; the floor retired on 2026-09-18 when A11.03's pack mix was owner-signed
    and the rate blended to 13.6%. A11.22 published the referral-fee band $78.5 to $146.7K, $114.2 to $213.8K and
