  denominator: reaction window in the account's own scorecard periods; breach frequency as share of periods below
    the tolerance line; breadth as SKUs per month
  value: 'REACTION WINDOW, FREQUENCY, DURATION, BREADTH - four different quantities the worklist carried as one
    narrative. WINDOW, from A5.36''s cadence and A10.02''s consecutive-period rule: Walmart 2 quarters; Kroger 2
    quarters then the next annual review; Whole Foods 2 quarters; UNFI and KeHE 2 weeks to a corrective action plan,
    on one distributor-side trigger; Costco per rotation; suppliers 45 days. FREQUENCY of crossing the TOLERANCE
    line, from A5.11''s means and A5.17''s dispersion: Walmart in-full below 90 in 4 / 15 / 39% of months; Walmart
    on-time below 85 in 31 / 55 / 77% of months. ON-TIME LIVES BELOW ITS TOLERANCE LINE, and that is the shape of
    the character - large fine dollars every month with delisting still rare, because the fine tracks the case share
    while the drop line tracks the quarter mean. DURATION is GENERATED, not asserted: DECISIONS#A10.08 - this row''s
    own decision_ref - says in terms ''Do not: state an episode duration. It is an output, and the worklist''s occasionally
    was a narrative word standing where a distribution belongs.'' Duration is an output of the seeder''s monthly
    draw and this row states the distribution''s parameters, which are the frequencies above, and nothing else.
    THE WINDOW IS ASSERTED AND THE DURATION IS GENERATED - they are different quantities and conflating them is
    what let the worklist read ''occasionally'' as though it were a number. BREADTH, from A5.21''s stockout share
    across the live catalogue - 39 / 39 / 41 SKUs, club packs existing only from y3 (A2.01): 1.6 / 2.1 / 2.9 SKUs
    in any month. DERIVED AS A DISTRIBUTION AND NOT A MEAN (2026-09-21, scripts/group10_floors.py''s breadth_concurrency()):
    each live SKU is out or not in a month, so the count is Binomial(active, stockout) and THE MODE IS 1 / 2 / 2.
    The y3 mean is 2.87, and the mode of a binomial is floor((n + 1) p). THE THREE-SKU NARRATIVE SURVIVES AND IS
    NOW EXACT: a three-SKU month is 13.45 / 19.84 / 23.20% likely, so in y3 it sits beside the mode rather than
    at it - 23.20% against the mode''s 23.71% - and at least three are out in 20.40 / 36.36 / 55.44% of months,
    which is one month in five in y1 and better than half of them by y3. A three-SKU story is ordinary by y3 and
    uncommon before it.'
