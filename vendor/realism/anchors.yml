  value: 'OREGON''S RMA IS INSIDE THE WINDOW, AND THE BRAND IS OBLIGATED - derived in A11.25, not asserted (ruled 2026-09-14).
    THE EXEMPTION IS SEVEN TESTS, ANY ONE OF WHICH EXEMPTS (ORS 459A.863): a nonprofit; a public body; gross revenue
    under $5M in the most recent fiscal year - counted worldwide, as Wine Institute reads it, and aggregated across associated
    producers under OAR 340-090-0860; under 1 metric ton of covered products sold in or into Oregon in the most recent
    calendar year; a beverage maker under 5 tons; a restaurant or food cart; a single store with no online sales. The
    revenue test fails and the tonnage test fails on every reading of in-state volume and weight (A11.25). THE DATED
    SEQUENCE rests on DEQ''s producers page, dated 2025-03-21 by its earliest Internet Archive capture under the owner''s
    undated-sources rule - Tier A: twelve captures fall inside the window, and the ten read carry all three figures,
    the other two being same-day duplicates: DEQ approved Circular Action Alliance''s plan on 2025-02-21 and CAA is Oregon''s
    only producer responsibility organization; producers reported 2024 supply by 2025-03-31; CAA may charge fees from
    2025-07-01 (2021 c.681 s60); invoices on the 2024 data went out in May and June 2025 by Arnold & Porter''s account
    and in July by Tonkon Torp''s, and payments began in July 2025. THAT SEQUENCE IS THE DATED COMPLIANCE TASK N32 CARRIES.
    THE PRODUCER of an item sold in an Oregon store is the manufacturer if it is sold under the manufacturer''s own brand,
    otherwise the brand licensee, otherwise the importer (ORS 459A.866): on its in-house lines the brand is the manufacturer,
    and whether a brand owner whose product a co-packer makes is the producer is not settled by the text read; for a
    DTC parcel, whoever packs and ships is the producer of the shipping packaging. RATES, per pound supplied into Oregon,
    by material: glass at $0.11 in 2025 is REPORTED, not a line rate, and TIER B, EFFECTIVE-DATED TO 2025 (owner,
    2026-09-15, item 6): the 2025 figure is a CLASS AVERAGE and no dated CAA schedule for 2025 is public, so the row
    carries the rate with its year rather than as a standing value, and the dated 2026 schedule is printed beside it and
    never applied to the window (A1.07''s Do-not). It is - the class average for glass and ceramics in CAA''s webinar deck of 2025-05-29, which a trade association
    reproduces; CAA''s program plan of 2024-12-06 printed only draft estimates of 10.0 and 14.0 cents for glass bottles
