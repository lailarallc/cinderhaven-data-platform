  value: 'RATIONALIZATION, ONE-IN-ONE-OUT AT THE FORMAL-REVIEW ACCOUNTS - the ordinary exit, beneath which the velocity
    floor stays as the catastrophic layer. A new authorization at review takes a slot; the retailer frees one by
    cutting the brand''s lowest-velocity-index authorized item unless the account''s net count grows. WHO TAKES
    A LAUNCH: it is pitched at every account''s next review and authorized at the top-k FORMAL-REVIEW accounts by
    A5.38 revenue rank, k = 3 owner-signed (band 2-4), with Whole Foods and UNFI one natural leg. So each of A7.09''s
    six launches after y1 goes to Walmart, Kroger and the WF/UNFI leg: 18 authorizations. CUTS = an account''s new
    authorizations minus its A7.26 net growth: Walmart 3 - 1 and 3 - 1 = 2 and 2; Kroger 3 - 1 and 3 - 0 = 2 and
    3; WF/UNFI 3 - 0 and 3 - 1 = 3 and 2, on A7.26''s counts, whose door-SKU totals put Whole Foods'' 15 in y3 -
    the generator had carried it from y2 (corrected 2026-09-14). TOTAL 14 over the window, timed to each account''s
    review cadence (A10.03, A10.04). DERIVED 2026-09-21 by scripts/group10_floors.py''s rationalization_cuts(),
    which this row had never had although the arithmetic closed in prose: cuts by account 4 / 5 / 5 over 18 authorizations.
    Sprouts and Costco review formally but are not
    top-3, so they take no launch and cut nothing. RANGE EXTENSION: Regional and the distributor-served independents
    have no formal line review; they add existing-catalogue SKUs on a broker or distributor pitch at any time, with
    no slot to free, so A7.26''s +2 and +1 there create no cut. WHICH SKU
    is cut is A10.16''s forecast-ranked set measured on actual, so rationalization and the floor share one velocity
    distribution. IN A11.21''S DRAW the launches arrive at A7.09''s three a year from y1, and the cuts are 12.71
    over nine launches, 2.09 of them on launches; this row''s 14 counts the six after y1. THE LEVEL: these cuts
    and A10.16''s 12.06 floor delists are ACCOUNT-level. R4''s exit gate counts SKUs leaving the catalogue, derived
    in A10.09, and they are not added to it.'
