# Anchor registry — the record of truth for check_anchor_coverage.py.
# Narrative for each record lives in docs/anchors/sourcing/<group>.md; this
# file is what the gate reads. Nothing here is `pinned` until the owner and
# U14 say so: a row is pinned on a U14 record that holds, in
# docs/anchors/TIER-A-VERIFICATION.md, or (Tier D) on its signature and
# decision_ref under ruling 4 (DECISIONS#u14); check_pinned_records blocks a
# pinned row without one.
#
# status:          candidate | decided | derived | practitioner | pinned
# pinned_from:     on a pinned row that was `derived`, the status the pin replaced (2026-11-06, DECISIONS#u14): the
#                  depends_on completeness check covers derived rows, and pinning must not take a row out of it.
# independence:    sec-filing | government | academic | company-published | trade-association | aggregator | vendor | none
#                  (company-published = the company's own IR release or site, not a filing;
#                  deliberately NOT `retailer-published`, which is an evidence_class value
#                  and part of the Tier A published subset — independence never satisfies the gate)
# evidence_class:  published-benchmark | retailer-published |
#                  practitioner-estimate | derived-from-adjacent |
#                  owner-judgment. Five values, resolved 2026-09-02: the Tier A
#                  gate is membership in the PUBLISHED SUBSET
#                  (published-benchmark or retailer-published), not a sixth
#                  value `published`. Source strength is carried separately by
#                  `independence`. See DECISIONS.md and plan U5.
# tier:            A = published evidence REQUIRED and available (hard gate)
#                  B = published preferred, practitioner allowed (soft gate)
#                  D = decision or derivation - no source possible; requires
#                      rationale, decision_ref, and plausibility_anchor when
#                      `drives` includes a regen item. Tier is EVIDENCE TYPE,
#                      not importance; importance is `drives`.
# unit:            usd-curve | ratio | pct | pct-mix | count | date-range |
#                  definition | formula. Any pct / ratio / pct-mix row MUST
#                  carry a non-null `denominator` - structural, not a regex.
# source_date:     publication date of the primary source (R12 requires it).
# depends_on:      optional list of IDs this row is derived from - anchor IDs, or a
#                  package item ID such as N23 where the upstream is an entity rather
#                  than an anchor. A derived row
#                  inherits the weakest upstream gate: if any dependency is Tier A with no
#                  U14 record that holds (restated 2026-11-03 from verified_by, which stays
#                  empty: no external review takes place, DECISIONS#u17-start), the dependent row is not pinnable either. A FORWARD
#                  REFERENCE to a row that is not registered yet counts as unverified -
#                  a row that does not exist cannot carry a verified_by, so it blocks
#                  rather than disappearing from the closure. The check must carry
#                  unregistered upstreams, not skip them.
#                  A Tier D DEFINITION upstream (unit: definition | formula | date-range) is
#                  satisfied by its decision_ref existing. A NUMERIC Tier D row (any other
#                  unit) additionally requires `owner_signed` (date) before it can be pinned
#                  or satisfy a dependency - verified_by is for sources, owner_signed is for
#                  decisions, and a counterfactual magnitude may not rest on an unsigned one.
# signed_figures:  REQUIRED on every row carrying owner_signed, and only on those.
#                  "<count>:<12-hex>" of the figures the row published when it was signed, pooled
#                  across value, plausibility_anchor, figure, denominator and measured, and read by
#                  check_anchors.fingerprint_figures, which sees a range's upper bound, an NxM and
#                  .48 (owner, 2026-09-23; DECISIONS#fingerprint-every-figure-field). Not read, by
#                  ruling: rationale and sources[].
#                  A signature covers THE FIGURES THE OWNER REVIEWED, so if that set
#                  changes at all - a value moving, a figure added, a figure retired - the
#                  signature LAPSES and the row is re-signed at the new figures
#                  (DECISIONS#a-moved-figure-clears-the-signature, owner 2026-09-21). The cause
#                  is irrelevant: an upstream's VALUE moving and an upstream's FORM being
#                  corrected underneath the row are the same thing to a signature. The gate
#                  recomputes it every run and prints the fingerprint to paste on a genuine
#                  re-signature. Dates, anchor ids and requirement pointers are not figures,
#                  and the multiset is sorted, so a reflow or a reordering is not a change.
# two_endpoint:    true only for anchors feeding the counterfactual; the rest are
#                  single-endpoint by design and say so. THIS FLAG IS THE COUNTERFACTUAL
#                  SET - every other enumeration in the package points here.
#                  U14 iterates Tier A rows AND every two_endpoint row, whatever its tier,
#                  AND the regen plan's R16 first-order rows AND one hop of depends_on from
#                  them (owner, 2026-10-09; DECISIONS#u10-restatement). The transitive closure
#                  of the two_endpoint rows left U14's set that day: rows further up a chain
#                  are derived by the generators and watched by the gate.
# first_order:     true on R16's first-order rows, the ones the owner reviews in U17, and on no other row
#                  (owner, 2026-10-07; DECISIONS#u10-restatement). The set is ruled by id, not by tier or
#                  flag: the spec gate holds the ids once (U14_FIRST_ORDER) and blocks when the flagged set
#                  differs from them, so unflagging a row to clear a check fails the gate. The platform reads
#                  the flag from the vendored copy (U5). Set 2026-11-09, U17's first commit.
# history:         optional. What a row's figures USED to be -- retired values, superseded drafts,
#                  what a restatement replaced -- moved out of the fields that state the present
#                  (owner, 2026-09-25; DECISIONS#history-move). Not fingerprinted, and read by no
#                  figure check, so a retired figure can neither publish a constant nor hold a
#                  signature. A sentence moved from a field other than `value` is prefixed with
#                  that field's name in parentheses.
# For anchors with more than one source, `source_url` is the primary and
# `sources:` carries the rest with their own figure/measured fields.

