  value: 'BITEMPORAL SCOPE - three fact families carry valid_from and valid_to (owner, 2026-09-12): deductions reclassified
    after arrival (type, bucket or validity changed), portal POS restated (a delivered week revised), and inventory
    revalued (a write-off or standard change posted to a closed period). Everything else stays point-in-time. AS-OF
    GRID: monthly, at month-end. LAG: 60-120 days from the original record to its restatement. MATERIALITY FLOOR: $250
    - a smaller change is not restated. On A10.17''s per-type amounts, printed by the group-11 generator, that floor
    exempts 53.2% of deductions by count and 21.1% by dollars (50.9% and 17.9% before A10.17 moved three means into their bands on 2026-10-13): a lower mean means more, smaller deductions, and the materiality floor exempts more of them, so restatement follows the money. THE SOURCE OF MOST
    RECLASSIFICATIONS is A4.21''s 20% of deduction dollars that arrive unitemized. OWED BEFORE GENERATION: the restatement
    rate and the direction mix - a symmetric mix nets to nothing over a quarter and produces no finding - the table-level
    scope within each family, and the alignment of the as-of grid with portal receipt dates. N26''s rule holds: as-of-latest
    equals today''s values, so canonical does not move.'
