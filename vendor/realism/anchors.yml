  history: 'A5.02 asserted 120 small-account orders a year; the owner retired it as the error on 2026-09-15 (item 7), for the tier''s dollars over a Faire-typical order of about $450. At A5.02''s retired 120 orders a year the implied small-account order value was $4,875, $4,570 and $5,256, which A5.02''s one-pallet acceptance floor of about $5,100 failed in y1 and y2; the contradiction goes with the count. A9.11''s small-account days to pay were 70 until the restatement applied 2026-09-14, which set them to 60 on Faire''s 60-day payout. Before the split of the small-account tier''s dollars was signed (owner, 2026-09-15, item 7), the whole tier had been charged Faire''s fees of $93.2K, $92.7K and $106.6K.'
