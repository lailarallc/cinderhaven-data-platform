    door-SKUs; phantom / store-SKU-weeks
  value: 'On-shelf availability: OOS 8.3% worldwide / 7.9% U.S. average (Gruen, Corsten, Bharadwaj 2002); promoted
    items ~2x; store-level causes 70-75% (ordering, replenishment). Shopper response: 31% buy elsewhere, 26% substitute
    another brand, 19% substitute same brand, 15% delay, 9% no purchase. CINDERHAVEN store-SKU-weeks not on shelf: 9% / 10.5% / 12% y1 / y2 / y3, y2 the midpoint of the registered endpoints, ABOVE THE U.S.
    AVERAGE ON THE PACKAGE''S OWN REGISTERED CAUSES: A5.11''s fill failures and the replenishment lag behind them, and
    phantom inventory. NOT ON VELOCITY (owner, 2026-11-03, DECISIONS#u14): the source finds faster-moving items run
    HIGHER out-of-stock rates (13-15%) and slower ones lower, so low velocity cannot carry the brand above the average;
    void rate (authorized never stocked) 6% of door-SKUs; phantom inventory (system stock, empty shelf) 3% of store-SKU-weeks;
    episode duration log-normal, median 5 days, 25% >2 weeks (over 14 days, the went-dark tail; sigma 1.53, mean
    16 days), so EPISODES form - the i.i.d. Bernoulli gaps are retired. Zero-unit weeks are representable. Achievable:
    6% / 2% / 1%. DURATION SPLITS BY CAUSE (owner, 2026-11-03, DECISIONS#u14): the 5-day median and the two-week
    tail are SUPPLIER-CAUSED episodes, PRACTITIONER, and the source contradicts them - its one duration study
    (Exhibit 8, 13 U.S. stores) restocks 20% within 8 hours and 45% within a day, and only 19% last three days or
    more. Store-caused gaps run at that median, about a day; they are not planted, and stay in the weekly
    not-on-shelf rate as days. The supplier-caused share of the not-on-shelf weeks is derived from the brand: the
    U.S. average''s 7.9% at GMA''s 28% upstream share (Exhibit 2), plus every point of the brand''s rate above 7.9%,
    so 36.8 / 45.8 / 52.6% y1 / y2 / y3; A7.15 plants only those.'
  source_url: https://www.supplychain247.com/images/pdfs/GMA_2002_Worldwide_OOS_Study.pdf
  source_date: '2002-05-01'
  figure: Worldwide average OOS 8.3%; U.S. 7.9%; 71,000+ consumers, 29 countries; shopper responses 31/26/19/15/9;
    70-75% of OOS caused at store level
  measured: Academic study (Gruen, Corsten, Bharadwaj) for GMA, FMI and CIES, funded by a grant from Procter & Gamble,
    the canonical OOS reference; rates are category-wide averages. The Cinderhaven rates and the duration distribution
    are practitioner.
  history: 'Mechanism restated 2026-11-03 (owner, DECISIONS#u14): the row put the brand above the average on
    "specialty: low velocity, phantom inventory". The study it cites finds the reverse on velocity (p. 15).'
  sources:
