  denominator: '% change in units / % change in price (elasticity); dip as share of promotion-week incremental units'
  value: 'Promotional response: price elasticity -2.62 (Bijmolt, van Heerde & Pieters 2005 meta-analysis, 1,851
    elasticities from 81 studies) -> TPR-only lift at constant elasticity: 10% off +32%, 15% off +53%, 20% off +79%,
    25% off +112% - the pooled mean of sales, market-share and choice elasticities, applied here as a sales
    elasticity to a temporary price reduction, a reading the meta-analysis does not make; merchandising multipliers
    on the price lift, PRACTITIONER ESTIMATE, NO SOURCE (owner, 2026-11-03, DECISIONS#u14): feature x1.5, display
    x1.8, feature+display x2.5.
    Post-promotion dip = 15% of the promotion-week lift, spread over the following 2 weeks (van Heerde, Leeflang
    & Wittink 2000: 4-25% of the current effect). Decomposition of the bump: ~1/3 brand switching (incl. sibling
    cannibalization, of which own-SKU 20% of the lift, practitioner, no source), ~1/3 purchase acceleration/stockpiling, ~1/3 category expansion
    (van Heerde et al. 2004). Per-event trade allowance per A4.13.'
  source_url: https://journals.sagepub.com/doi/10.1509/jmkr.42.2.141.62296
  source_date: '2005-05-01'
  figure: Mean price elasticity -2.62 across 1,851 estimates (JMR 42(2), 141-156)
  measured: Meta-analysis of published brand-level price elasticities; specialty sauces likely sit in the less-elastic
    half, which the merchandising multipliers and the owner's A3 bands can temper. Dips and decomposition from two
    further peer-reviewed papers.
