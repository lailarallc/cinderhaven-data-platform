  unit: usd-curve
  denominator: dollars per deduction, by A4.05 type; counts are deductions per year against the A4.01 + A4.31 bucket pool
  value: 'PER-TYPE MEAN DEDUCTION AMOUNT, the table A9.19''s mean was attributed to and the package never held.
    One mean for each of A4.05''s ten types, owner-signed 2026-10-13: short_ship $450, late/OTIF $1,291.24, damaged/unsaleables $350, spoilage/short-dated $600, receiving miscount $150, label/pallet/ASN $250, pricing_error $263.56, post-audit $3,000, overage $156.37, other $400. THE BAND IS THE CHECK ON THE MEAN (owner, 2026-10-13, DECISIONS#u18-rulings Q1): a signed mean must lie inside its own signed p10-p90, since a mean below its p10 or above its p90 is impossible for the log-normal the row claims. Seven practitioner means do and stand; three did not and take their band''s log-normal mean: late/OTIF $1,291.24, pricing_error $263.56, overage $156.37. WHAT IT DERIVES: A4.05''s dollar share divided by each mean gives the COUNT
    by type, and 1 / sum(share_t / mean_t) gives the OVERALL MEAN = $350.3. The count mix is nothing like the dollar
    mix - receiving miscounts are 8% of dollars and 18.7% of count, post-audits 6% of dollars and 0.70% of count
    - which is the whole reason a dollar-weighted mean could not be read off A4.05''s shares. PRICING_ERROR IS TIER CONFUSION ALONE (owner, 2026-10-19, DECISIONS#u18-rulings Q9): its band covers a line
    keyed at the wrong price tier; A6.19''s decimal shifts never reach a deduction - a shift up is caught at the
    retailer''s PO-cost match and short-paid or rebilled, a shift down is lost revenue - so they sit outside this
    band and outside A4.05''s pricing_error dollars. WITHIN-TYPE BANDS, p10-p90, owner-signed 2026-09-12: short_ship 150-1,500; late/OTIF 400-2,500; damaged/unsaleables 150-600; spoilage/short-dated
    200-800; receiving miscount 50-400; label/pallet/ASN 250-1,500; pricing_error 150-400; post-audit 1,000-8,000;
    overage 50-300; other 100-2,000 - all ten from group 4''s sourcing table, so none is extrapolated. Within-type
