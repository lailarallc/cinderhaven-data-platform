    figure: OOS 8.3% worldwide, 7.9% U.S.; responses 31/26/19/15/9; store-level causes 70-75%; promoted items 2:1;
      fast movers higher (13-15%); duration in 13 U.S. stores 20% under 8 hours, 25% to a day, 36% one to three days,
      19% three days or more (Exhibit 8)
    measured: '''Retail Out-of-Stocks: A Worldwide Examination of Extent, Causes and Consumer Responses'', GMA 2002
      - copy hosted by SupplyChain247; funded by a grant from the Procter & Gamble Company (title page), a
      manufacturer; read 2026-11-02'
