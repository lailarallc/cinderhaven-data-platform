  value: 'Human error per MECHANICAL action (keying a value) 0.2-0.5%; per COGNITIVE action (choosing a UOM, a price
    tier, a ship-to) 2-5% (Panko 2008). A manually keyed order line has ~4 mechanical fields (item, quantity, price,
    date) and ~2 cognitive ones (UOM, ship-to). At the CHARACTER''s rates (rushed, untrained: 0.4 / 3.0): P(line
    error) = 1 - 0.996^4 x 0.97^2 = 7.4% of manually keyed lines; a disciplined desk (0.2 / 2.0): 4.7%. EDI-received
    lines are A6.32''s, mapping and partner-file drift, not humans, and unsourced. The per-line rate is a BAND on
    the reading of a cognitive field (owner, 2026-10-25, DECISIONS#u14): choosing a UOM or a ship-to from a list,
    read as Panko''s keystroke action rather than his complex thought, gives 2.4% to 7.4% a line at the character
    and 1.2% to 4.7% disciplined; the points stay 7.4% and 4.7% until the network pass picks the reading. Ratio
    manual : EDI across both bands, 4.8x to 148x per line at the character and 2.4x to 95x disciplined, 74x and
    47x at the points; bands until the network pass gives points (owner, 2026-10-23 and 2026-10-25).'
  history: 'Until 2026-10-23 (owner, DECISIONS#u14) the row carried the EDI-received rate itself, 0.1% with no source,
