- anchor_id: A10.02
  tier: D
  drives:
  - survivability_check
  - R8
  status: pinned
  owner: shawn
  two_endpoint: false
  unit: pct
  denominator: each metric's own denominator, per account, as registered on the metric's defining row (A10.01's
    flagged set)
  value: 'THREE LINES per flagged metric - target / tolerance / drop. The target is the account''s published or
    registered target; the TOLERANCE is target - 5 points, owner-signed practitioner, AND ITS SCOPE IS NARROWER
    THAN NINE ROWS: it applies to a percentage fill score whose programme publishes only a target, which is four
    of the nine - Kroger, Whole Foods, Sprouts and Regional fill. FIVE DO NOT FOLLOW IT and each carries its own
    basis rather than being bent to the rule. WALMART''S in-full and on-time tolerances are PROGRAM LINES, fixed
    at 90 and 85 by its own scorecard rules in every year, not a formula on a moving target (owner, 2026-09-23).
    Costco''s tolerance is measured at a DIFFERENT WEEK (75% by week 10 against a 100% target by week 12), so subtracting
    points from the target would compare two different measurements. UNFI and KeHE SHARE a tolerance of 90 against
    targets of 95 and 98, because the corrective-action trigger is one distributor-side process and not two - which
    makes KeHE''s gap 8 points by design, not 5 by arithmetic. The supplier line is a DAY COUNT, not a percentage,
    so the rule has no meaning on it. The DROP is A5.17''s registered rule, not a new number. Walmart in-full 98
    -> 95 (A5.16''s effective dating) / 90 / 85 for two consecutive quarters; Walmart on-time 98 -> 90 / 85 / 80
    for two consecutive quarters. Kroger fill 95 and on-time 95 / 90 / A7.12''s registered velocity floor of 60%
    of category average at the annual review. Whole Foods direct fill 95 / 90 / delist review after two quarters
    below 90. Sprouts fill 95 / 90 / same rule, authorized from Q1 y2 so no drop is reachable in the window. Regional
    fill 90-95 / 85 / none in window, fees only (A5.15). Costco sell-through of the rotation 100% by week 12 / 75%
    by week 10 / below 60% no re-order, owner-signed because no Costco programme publishes a sell-through line.
