  unit: ratio
  denominator: median catalogue velocity of the live non-club sizes, in the same quarter
  value: 'THE BRAND PRUNES ITS OWN CATALOGUE AT THE ANNUAL PLANNING CYCLE (owner, 2026-09-14, third rulings 4):
    discontinue a size below 25% OF MEDIAN CATALOGUE VELOCITY in 2 consecutive quarters that NO NATIONAL ACCOUNT
    AUTHORIZES. Mature pruning is the brand''s decision, not the run floor''s: at A2.09''s fading rate the ruling''s
    own arithmetic put a size at the draw''s y1 mean almost nine years from A5.29''s floor, and the run floor binds
    the RECIPE, so a declining size survives beside a recipe-mate in a recipe selling a median 14.8 times its two
    minimum runs. Brands cut on contribution and complexity long before that. THE THRESHOLD IS OWNER-SIGNED AND
    SET LOW, because a poorly managed brand keeps zombies; the count derives and is printed, and a count near zero
    is the finding, not a reason to move the threshold. FOUR READINGS CONFIRMED with the ruling: velocity is the
    size''s catalogue multiplier with its A2.09 decline, not its units at any account; the median runs over the
    live non-club sizes, the club designs being Costco''s rotation rather than catalogue slots; ''national authorization''
    is A11.24''s three launch accounts, where A11.19''s resets also count Sprouts and Costco; and the rule first
    applies at y2''s cycle, the first with two in-window quarters behind it. WHICH TWO QUARTERS IS A READING - the
    two the cycle has behind it, t-1 and t-2, each measured before that year''s fill and that quarter''s launch.
    WHAT DERIVES, at 6,000 trials: 4.15 sizes over the window, 0.00 / 2.91 / 1.25 by year - other mature 2.61, A2.09
    at-risk 0.70, fading 0.85, launches 0.00, since a launch no national account carries already exits through A11.24.
    Only 0.04% of them were carried at an account with a set in the quarter they went: these are zombies living
    on distributor and DTC volume. THE RULE DOES NOT MOVE THE ACCOUNT FACTOR - pruned sizes sit in no formal-review
    account''s set, so the y3 sets spread 0.70 either way and A11.21''s factor, A7.13''s shares and the 24-month
    share are unchanged to every published decimal (measured 2026-09-16). What it moves is exits, SKU-DC pairs and
    the mature hazard: with the rule the draw''s hazard is 0.40 / 8.09 / 3.85% a year, and with the rule off the
    draw gives 4.02 exits over the window, 1.17 / 1.28 / 1.56 a year, with R4''s pass mark there at 2 against a
    median of 4. See A10.09, A11.21 and A1.10. TWO REGISTERED READINGS THE RULE RECONCILES, neither of them its
    input. A2.01 reads the live catalogue as 39 sizes at window start: with the rule off the draw inflates it to
    39.00 / 40.83 / 42.55 non-club sizes at each year''s start, ending the window at 43.98, because launches arrive
    at three a year and almost nothing mature leaves. With it the draw gives 39.00 / 40.83 / 39.66, ending at 39.91.
    The second is the hazard above: without the rule it is 0.40 / 0.15 / 0.26% a year, which the owner flagged against
    the 5-8% expected when A2.09''s decline rates were signed.'
