    Amazon unit because no registered row gave a per-band fee. A11.31 CLOSED THAT GAP THE SAME DAY, on Amazon''s
    dated rate card and A11.03''s owner-signed pack mix, and A9.01''s marketplace line reads it beside this row;
    this row did not close it and does not carry it. A2''s per-SKU packaging-weight column is still owed (A2.08).'
