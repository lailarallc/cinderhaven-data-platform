  denominator: null
  value: 'RESOLVED BY A11.01: THIS BRAND HAS NO SHORTAGE CLAIMS AND NO PO CHARGEBACKS. Both are Vendor Central (1P)
    mechanisms - a 3P seller sends Amazon no purchase-order invoice to short - so the worklist''s ''dominant Amazon
    deduction type'' correctly has nowhere to land. WHAT A 3P/FBA BRAND CARRIES, registered as event types: FBA LOST
    AND DAMAGED INVENTORY REIMBURSEMENTS, at the typical sales price less fees and then at manufacturing cost from
    2025-03-31, a change announced for March 10 and moved (third-party summaries of Amazon''s notices), with the warehouse-loss
    claim window cut from 18 months to 60 days on 2024-10-23; CUSTOMER RETURNS AND REFUNDS, where ''grocery is refunded
    without a return'' is NOT confirmed on an official marketplace page - the official wording found is Amazon''s physical-store
    policy - so the mechanism is practitioner; INVENTORY FEES at A11.22, which registers January-September storage
    and owes the October-December rate and the storage-utilization, aged-inventory and low-inventory-level fees; and
    BUY BOX LOSS TO UNAUTHORIZED RESELLERS, diverted promotional product listed 3P below the brand''s own offer, which
    A3.13 counts below MAP from year 3 and monitors against DTC before it. ''AMONG THE MOST AGGRESSIVE IN RETAIL''
    (09:54) IS STRUCK: it describes Vendor Central''s claim regime, which this brand does not have, and it carried
    no rate. THE BUY BOX SHARE (owner-signed 2026-10-20, DECISIONS#u18-rulings; Tier B, NO PRIMARY SOURCE): outside disaster 1 the brand''s own offer holds the Buy Box 95% of the time; during the undercut weeks it holds 0%, because a diverted FBA offer priced below the brand''s takes the box. The 95% is practitioner: seller guides call 90% and above excellent, and the widely repeated share of sales through the Buy Box traces only to secondary pages, so neither is Amazon''s. STILL OWED, AND ON THE CRITICAL PATH: the reimbursement frequency, the return rate and the undercut depth. Whether Amazon''s
    prep and label fees apply to a 3P seller is not verified. None of these is read by A9.02, for A11.01''s reason.'
