    non-peak, which on the window''s 92 days is $0.00570 / $0.00831 / $0.0109M. TIER B AND NOT A, because it is a dated
    statement''s consequence and not a rate anybody read; the 2025 peak card itself is still owed. THE SEASONAL
    SHARE IS A READING AND THE LARGEST UNCERTAINTY IN THE LINE: no registered row gives Amazon''s units by month,
