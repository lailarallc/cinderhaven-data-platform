  value: 'Credit facility: asset-based revolver, $3.0M commitment at window start, UPSIZED to $4.5M in Q1 y2 after
    a field exam - the ledger (A9.13) is what forces it, DATES it and SIZES it: the November y1 peak need of $3.61M
    already exceeds the $3.0M line, so the exam follows that peak and the upsize lands in the first quarter of y2.
    The commitment by window year is $3.0M / $4.5M / $4.5M, held after the upsize. The earlier Q2 y2 date was derived
    from a September y2 breach the restated ledger no longer produces, and a date that no longer falls out of the
    rows is not a derived date. SIZING: $4.5M is the largest half-million increment at or below the PROJECTED y2
    peak base of $4.555M, which it clears by 1.2%. Against the $3.834M base actually examined at the November y1
    peak, $4.5M is 117.4%; the y3 base of $4.885M no lender can examine in Q1 y2. Rate: prime + 1.5% - FRED MPRIME
    annual averages 2023 8.19% / 2024 8.31% / 2025 7.37% -> all-in 9.69% / 9.81% / 8.87%; ACTUAL/360, which A9.13
    now carries (x 365/360) rather than asserting; unused-line fee 0.375%. The 150bp spread is practitioner and
    unsourced - the INDEX is Tier A, the spread is not, and the row says so. BORROWING BASE, standard ABL rules:
    advance 85% of eligible AR LESS a dilution reserve (dilution above 5%, point for point). DILUTION = A4.31''s
    billback and MCB dollars deducted from remittances (9.0% of gross) + A4.01''s operational deductions = 13.50
    / 14.25 / 15.00% -> advance 76.5 / 75.8 / 75.0%. INELIGIBLE: invoices > 90 days (8% of AR), the open deduction
    residuals (A9.15), DTC receivables; concentration cap 25% of eligible AR per obligor, 50% for investment-grade
    obligors, which does not bind. Inventory 50% of eligible finished goods at cost (at the November peak 2.722
    / 3.646 / 4.366) with a $1.5M sublimit, which binds in y2 and y3. November-peak base 3.83 / 4.55 / 4.88 - ABOVE
    the commitment in every year - though y2 clears by only $0.0549M - so the COMMITMENT binds and the base never
    does. BUT THE BASE IS NOT LARGE ENOUGH EITHER, FROM y2 ON: peak need 6.774 against 4.555 and 10.078 against 4.885,
    so a commitment written to the WHOLE examined base would still leave $2.22M and $5.19M unfunded. After Q1 y2
    no further upsize is a remedy, which is what makes the y3 shortfall a funding gap rather than a paperwork one.
    COVENANTS, restructured 2026-09-11 (owner-signed): the HARD test is minimum excess availability $250K, availability
    = min(commitment, base) - draw. The fixed-charge covenant is SPRINGING, not standing - an asset-based lender
    underwrites collateral, not profit, so a borrower at or near breakeven gets the line with the FCCR dormant.
    It is tested only when excess availability falls below the greater of 10% of the commitment and $250K (0.30
    / 0.45 / 0.45), on trailing twelve months at that date, at >= 1.10x with (EBITDA - maintenance capex - owner
    distributions) over (interest + fees). TRIGGER VALUES, both stated because the upsize moves the test and not
    only the line: the greater of 10% of commitment and $250K is $300K in y1 and $450K from the Q1 y2 upsize, so
    the y2 and y3 tests run against the larger. CONSEQUENCE ON BREACH: default rate +200bp (2.00% a year over the
    contract rate), borrowing-base certificates weekly rather than monthly, and a FORBEARANCE FEE of $11,250 = 0.25%
    of the $4.5M commitment. Both the fee and the +200bp are READ by A9.13''s fee line in every year the ledger
    forbears, which is y2 and y3; the default-rate charge is an upper bound because the breach begins when availability
    crosses the trigger, not on 1 January. THE y1 EVENT IS ONE AMENDMENT WITH THREE TERMS, not three events: waiver
    of the sprung FCCR, the upsize to $4.5M, and the covenant reset that follows it, on a SINGLE AMENDMENT FEE of
    $7,500 = 0.50% of the $1.5M commitment increase, effective Q1 y2 and read into A9.13''s y2 fee line. It is NOT
    the $7.5K over-advance fee retracted on 2026-09-06 - same figure, different instrument and a different derivation
    - and the row says so because the coincidence would otherwise read as a resurrection. Both fees are practitioner,
    owner-signed 2026-09-11, plausibility standard small-ABL amendment terms. The forbearance fee prices a breach
    the lender does NOT cure, and is the other path, not this one. The standing 1.10x covenant is WITHDRAWN: at
    A9.02''s restated EBITDA it is breached in every window year, which describes a facility that would never have
    closed. Need, utilization, availability, interest, the events and the deductions-as-cash links are the ledger''s
    outputs and live in A9.13; the consequence chain after a breach belongs to group 10.'
