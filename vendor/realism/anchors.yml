    both now derive from A10.17. Concentration curve (A9.19): THE RETIRED FORM WAS Phi(sigma - Phi^-1(1 - q)), which
    is the Lorenz share of a SINGLE log-normal and gave 82.4% and 36.2% against the mixture''s 82.7% and 36.9%:
    the mean-median-matched single carries the LIGHTER upper tail, so it understated concentration by more the deeper
