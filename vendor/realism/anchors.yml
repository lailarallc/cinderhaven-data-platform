    four sales-tax quarters (TRANSCRIBED: no tax.ny.gov page could be read, DECISIONS#u14); Alabama and Mississippi
    $250,000. Food taxability: shelf-stable sauces, condiments, honey, maple and oils are ''food
    products'' exempt from state sales tax in the large majority of states; taxable at reduced state rates in Alabama
    (2% from Sep 2025), Mississippi (5% from Jul 2024), Missouri (1.225%), Utah (1.75%), Illinois (1% until its
    repeal on 2026-01-01); fully taxable in Idaho, South Dakota, Hawaii (and Oklahoma until 2024-08, Kansas until
    2025-01); gift sets with non-food items taxable everywhere. CINDERHAVEN''S CROSSINGS, ON TOTAL IN-STATE SALES
    (owner, 2026-11-02, DECISIONS#u14): wholesale shipments count. They are delivered prepaid to the retailers'' DCs
    (A8.22), so they land in-state, and the thresholds count sales for resale. Wholesale goes by Census 2024
    population share (A8.22) and DTC by A8.20. Of the 46 taxing jurisdictions (45 states and DC), the brand is over
    the line in 41 in y1, 42 in y2 and 43 in y3, and was already over in 39 before the window, on $25M. California
    carries $3.77M in y1 and Texas $2.99M; DC, Vermont and Wyoming stay under through y3. The brand registers in NONE
    until a Florida notice in y2 Q3. The story is a wholesale brand that only ever thought about nexus for its web
    orders: un-filed returns in some forty states, mostly exempt food and resale-certificate sales, and
    penalty-and-interest exposure on the taxable minority, not the tax. Transaction counts are not tested; where the
    200-transaction alternative still stands, a state below the dollar line may cross on DTC orders.'
