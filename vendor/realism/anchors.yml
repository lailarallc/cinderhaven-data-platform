  value: 'Cash ledger, DERIVED and printed by scripts/group9_ledger.py, which is now the single generator for this group.
    THE FREE INPUTS ARE THREE, ALL SIGNED 2026-09-11: D0, the net standing draw at window start, $1.00M with its 0.5-1.5
    band still published; maintenance capex $0.30M; and owner tax distributions at 35% of POSITIVE pre-tax income. The
    distribution rate is signed and INERT in this window - pre-tax income is negative in every year, so nothing distributes
    and the rate moves no figure; it is registered for the counterfactual, where income is positive. Two former inputs
    are now derived: the peak month (A9.12, first half of November) and the finished-goods share of DIO (A9.12). NET WORKING
    CAPITAL = AR + inventory - AP less the deductions A9.02 has already charged - the accrued billback/MCB and operational
    deductions in unpaid invoices 0.477 / 0.628 / 0.740 and the non-recoverable residual 0.189 / 0.277 / 0.365 = 4.395
    / 5.614 / 6.434 against 3.321 pre-window - its small-account balance at Faire''s 30-day payout on the half of the tier
    that is on Faire at all, the terms in force before 2023-07-05 (A3.20) - growth 1.074 / 1.219 / 0.821. CASH FROM OPERATIONS
    -1.019 / -1.798 / -2.290 - negative in every window year. Standing draw at year end 3.093 / 6.109 / 9.219, the annual
    means beside the daily ledger''s Dec 31 positions below; interest and fees at A9.14''s actual/360 0.220 / 0.595 / 0.884
    - which now READ A9.14''s breach terms rather than leaving them beside the ledger. PEAK NEED, first half of November
    (0.875 elapsed) = the standing draw at that point plus the whole build = 3.609 / 6.774 / 10.078; excess availability
    against min(commitment, A9.14''s base) -0.609 / -2.274 / -5.578. THE BRAND ARRIVES ALREADY TIGHT: availability is negative
    in y1 at the signed D0, so the line is exceeded in the first window year, not merely the covenant tripped. THE EVENT:
    A9.14''s springing FCCR is tested when excess availability falls below the greater of 10% of commitment and $250K (0.30
    / 0.45 / 0.45), and it FAILS whenever it springs, because (EBITDA - capex - distributions) is negative in every year
    (FCCR -3.64 / -2.02 / -1.59). At the signed D0 it springs in EVERY window year - y1, y2 AND y3; the earlier reading
    that it springs once was the generator printing only the FIRST spring. At every point of the D0 band the first spring
    is y1. BREACH CONSEQUENCES, now read into the fee line: the y1 spring is cured by the Q1 y2 amendment, so its $7,500
    fee lands in y2; the y2 and y3 springs cannot be cured by a further upsize because the base will not support one, so
    each is forborne at $11,250 and carries A9.14''s +200bp default rate - 0.0976 in y2 and 0.1605 in y3. THE DEFAULT-RATE
    FIGURE IS AN UPPER BOUND on the annual ledger: the breach begins when availability crosses the trigger, and the daily
    ledger dates the springs to July 16 y1, January 1 y2 and January 1 y3, so y2''s and y3''s charge runs from the first
    day of each year. THE y1 STUB, dated: from y1''s spring to the Q1 y2 cure, the default rate costs $24K on the daily
    draw. FUNDING GAP at the November peak of y3: $5.58M, band $4.90M to $6.27M over D0, capex and the price band. SENSITIVITY,
    printed because these are the signed inputs: capex 0.15 / 0.30 / 0.45 gives a y3 gap of 5.07 / 5.58 / 6.09; distributions
    0 or 35% gives the same gap, because nothing distributes on a loss. Group 9 publishes the gap and stops. Closing it
    - an owner equity call, a DPO stretch (A5.21''s stockouts rise), or a Q4 build cut (A5.11''s fill dips) - is group
    10''s consequence chain. GROUP 10 REGISTERS THE CALL (owner, 2026-10-06, dated 2026-10-15): a convertible note from
    the existing owners, dated December 1 y2, the day after the daily ledger''s first credit hold on November 30 y2, funds
    y3''s November peak. This ledger is the line''s own, before the note, and the gap it prints is the finding; a call
    on November 1 y2 is the counterfactual beside it. THE y1 EXCEEDANCE IS A COMMITMENT SHORTFALL, NOT A COLLATERAL ONE,
    and y1 is the only year where that is true: peak need 3.609 against a 3.0 line with the base at 3.834, so 0.225 of
    collateral sits unused behind the draw. Availability crosses the springing trigger at a need of 2.700 before it crosses
    zero at 3.000, so the FCCR is tested and fails ahead of the ceiling touch, on July 16 y1. The 0.609 is absorbed by
    PAYMENT TIMING, not by a lender advance: 11.90 days of COGS at A9.11''s DPO - 78.3% of one semi-monthly AP run of 0.778,
    6.8 days of invoicing - so a run on A9.12''s 1st-and-16th cadence in the first half of November is part-held until
    the first Q4 collections land in the middle of November (the daily ledger part-holds 56 runs across the window, the
    first on September 1 y1), and DPO runs 32 -> 43.9 for the year: 13.9 days past the co-packers'' net 30, short of every
    consequence A10.07 registers - priority loss from 15 days past due, the late fee from 30, the hold at 45. IT IS NOT
    AN OVER-ADVANCE: the loan sits 0.225 UNDER the base, and naming a commitment shortfall an over-advance is the incoherence
    recorded 2026-09-06. THE LADDER GROUP 10 INHERITS: the same DPO lever funds the shortfall in 11.90 / 34.93 / 75.12
    days, DPO 32 -> 43.9 / 66.9 / 107.1. y3''s is the line alone, never capped: a co-packer stops at the hold, and on the
    daily ledger the first hold lands November 30 y2, so A10.19 lands December 1 y2 (2026-10-22). y1 is absorbed by timing;
    y2 and y3 are not, and from y2 the peak need passes the BASE as well (+2.219 / +5.194), so no upsize is a remedy. That
    is why y3 is a funding gap and y1 is not. DEDUCTIONS AS CASH: the open residuals are cash not collected, borrowed at
    the facility rate; the dilution reserve prices the base at the field exam and never binds because the commitment sits
    below the base; and the link that decides the package - unrecovered deductions are not merely the working capital,
    they ARE the margin, since A9.02''s achievable, +2.13% of gross against -2.37% current, is four-fifths deduction recovery
    and settlement discipline - 3.56 of its 4.50 points, the rest own-site DTC. The counterfactual does not close the funding
    gap on its own and this row does not claim it does. THE DAILY LEDGER (U16, owner, 2026-10-22, DECISIONS#u16-daily-ledger)
    is the source for balances: the same transactions on a calendar, its flows reconciling to the annual ledger''s at $1K.
    Its Dec 31 positions on the line alone: a draw on the line of 2.180 / 3.481 / 3.337 with the supplier stretch 0.776
    / 2.319 / 5.163 behind it, a need of 2.956 / 5.799 / 8.500; AR 3.902 / 4.911 / 5.556 and AP 2.759 / 4.814 / 7.923.
    Dec 31 sits just before the 1 January AP run and after November-December''s invoicing, which the annual means cannot
    see. Its own readings: need peaks on the 1 November run at 4.043 / 7.117 / 10.086 and falls first at the run of November
    16, A9.12''s trough day; line interest and fees run 0.245 / 0.473 / 0.454, because the stretch is supplier credit the
    annual ledger charges at the line''s rate; the fixed-charge ratio on that interest is -3.26 / -2.54 / -3.09; and A10.07''s
    late fee, a reading and not charged, 0 / 0.021 / 0.293.'
