    7 puts half the tier off Faire entirely, so A9.11''s 60 days is a blend struck from one of its two parts, and
    no row registers direct small-account payment terms. DSO is 41.90 / 42.19 / 41.49. THE COUNTS NOW RECONCILE (owner, 2026-09-15, item 7): A5.38 gives the tier $585K, $548K and $631K, and the order count is the tier''s dollars over a FAIRE-TYPICAL ORDER OF ABOUT $450 - 1,300, 1,219 and 1,402 orders a year, and A5.38''s dollars over that count give an order which is $450 / $450 / $450, by construction. A5.02''s own one-pallet acceptance floor is about $5,100; a $450 drop is not a pallet, so the acceptance test does not reach this tier. A2.15''s Faire first-order minimum
    sits below $450, as it should. A9.01''s 0.2% of gross is BRAND-WIDE bad debt of $65.0K, $81.2K and $93.4K; set
    against the tier''s dollars it would be 11.1%, 14.8% and 14.8%, and how much of it the tier carries is not registered
    - under Faire''s guarantee a Faire order carries none, outside its exceptions. OWED, AND ON THE CRITICAL PATH:
    account count, order frequency, dormancy, opening rate, the transaction-count share, direct-account bad debt and the direct half''s payment terms; 07:196 requires the account count, the converted_from_dtc share and a pre-registered dormancy rate among them. THE CONVERTED_FROM_DTC ACCOUNTS ARE DISASTER 2''S AND NO OTHERS (owner, 2026-10-19, DECISIONS#u18-rulings Q7): 3 accounts, 0 / 0 / 3 by window year - the Vermont shop and the two further shops of 07''s scripted event, written by U11 as R7 scripted events (03:111). No background conversion rate is registered: one would be an asserted row with no source. The share is these 3 over the account count once that count is pinned. THE SPLIT OF THE TIER''S DOLLARS IS
    SIGNED (owner, 2026-09-15, item 7): 40% through the FAIRE MARKETPLACE, 10% FAIRE DIRECT, 50% DIRECT - what this
    row owed and now has. A9.02 READS FAIRE''S FEES ON IT: the marketplace 40% pays A3.20''s 15% commission; FAIRE
    DIRECT''S 10% PAYS PROCESSING BUT NO COMMISSION, its 0% being in the Brand Terms and the processing that reaches
