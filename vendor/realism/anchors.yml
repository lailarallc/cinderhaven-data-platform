    20 / 30 / 50 of JARS: $2.945 a jar. On A11.01''s 108,454 / 158,162 / 207,870 units that is $0.319 / $0.466 /
    $0.612M at the non-peak rate, and $0.325 / $0.474 / $0.623M with the peak uplift below, which is what A9.01
