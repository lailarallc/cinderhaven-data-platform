    transit included (A5.06, owner 2026-10-05). The order cycle had not been cited to a row; it is A5.02''s registered
    cadence, weekly for Walmart and the distributors, biweekly for Kroger, monthly for Costco. OTIF-TO-FILL SPREAD:
    SCORED IS AT OR BELOW INTERNAL FILL ALWAYS, by A5.18''s credit rules, and THE GAP IS 0 TO 6 POINTS IN ANY MONTH
    WITH A WINDOW MEAN ABOVE ZERO, 2.68 points - RULED 2026-09-22 (DECISIONS#A10.13-otif-band) on the derivation
    and not on an assertion. A5.11''s gap is internal fill less retailer-scored in-full, 1.97 / 2.68 / 3.40 points
    by window year, widened by A5.17''s in-full sd of 2.5, giving a band of 0.00 to 5.90 points - raw -0.53 to 5.90,
    clipped at zero because A5.18''s credit rules make the gap non-negative by construction. The window mean equals
