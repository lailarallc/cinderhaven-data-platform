    already owns every retailer velocity floor and states them against the CATEGORY average (Kroger 60%, Whole Foods
    50% at the 90-day check, Sprouts 55%) or against the MODULAR (Walmart bottom quintile at reset). A bottom-15%-of-the-brand''s-SKUs
    rule would be a second definition of one quantity with a different denominator, and would delist Cinderhaven
    SKUs in a year when every one of them beat the category. This row reads A7.12 and adds no floor. THE MECHANISM:
    A5.21''s stockouts (4% -> 7% of SKU-weeks) concentrate on B and C items, which is what drives those SKUs'' fill
    below 90 and their velocity toward the floor - A7.12''s grocery index runs 85 / 78 / 70 against a floor of 60,
    so the BRAND MEAN clears it in every year and only dispersion puts an individual SKU below. THE AUTHORIZATION
    RULE IS NOW REGISTERED ON A10.16 and the count derives from the draw rather than from a tail integral: authorize
    on forecast, measure the floor on actual, and Kroger''s authorized SKUs below the floor run 4.69 / 5.21 / 5.86
    per annual category review for 9.893 delists over the window (A10.16), with the SKU x account factor the owner
    signed as structure on 2026-09-14. THESE ARE ACCOUNT-LEVEL DELISTS. R4''s exit gate counts SKUs leaving the
    catalogue, drawn per seed in A10.09 and A11.21, and the earlier reading that this row left the gate unsatisfied
    counted one level against the other; it is withdrawn. WHOLE FOODS: fill below 90 for two quarters is A10.02''s
    registered delist-review trigger, and THE y1 Q3-Q4 SCRIPTING IS RETRACTED (2026-09-21), DERIVED BY scripts/group10_floors.py''s
    wf_fill_risk() where the row had scripted a date with nothing computing it. A quarter mean carries A5.17''s
    monthly sd over sqrt(3), so the 90 line sits 3.03 / 1.76 / 0.50 quarterly sd above A5.11''s scored in-full by
    window year. A STATED pair of quarters in y1 is therefore a 1 in 649,795 event. A10.02 IS IN THIS ROW''S OWN
    depends_on AND SAYS IN TERMS that a line the model cannot reach ''is not a finding about the character'' and
    that reading it as a risk ''would overstate what the data does'' - and this row had done exactly that, in the
    one year where the line is furthest out of reach. THE RISK IS REAL IN y3 AND ONLY THERE: a stated pair is 9.51%
