  value: 'AMAZON CONTRIBUTION MARGIN, DERIVED, NEGATIVE ON BOTH BASES (owner, 2026-10-12, DECISIONS#amazon-fees-in-window). The mart''s Amazon row is sales less group 9''s marketplace_fees(t) (A11.22, A11.30, A11.31) less units at the cost the mart reads as cogs_per_unit, A3.29''s rolled standard. MART BASIS, BY WINDOW YEAR: -0.46 / -0.45 / -0.44% of Amazon sales. OVER THE WINDOW, the all-time row the mart and its band test read: -0.45%, band -5.4% to +4.6%. THE BAND IS A11.30''s: its ACoS band moves the margin point for point; A11.31 carries no band (a Tier A card, its Tier B additions stated as points), and A3.01 and A3.29 carry none. P&L BASIS, group 9''s landed cost at A9.16''s index and A9.17''s tariff, BY WINDOW YEAR: -6.0 / -6.9 / -7.1%. THE GAP BETWEEN THEM IS A NAMED DEFECT, not an accident (owner, 2026-10-12): the margin mart costs at the standard rolled once in January 2023, the P&L at landed cost as it moves, so the mart flatters Amazon by THE GAP, BY WINDOW YEAR: 5.6 / 6.5 / 6.7 points of Amazon sales, $54K / $92K / $125K, which is A3.01''s landed cost at the year''s index and tariff less A3.29''s standard, on Amazon''s units. It widens because the standard never re-rolls while input costs rise. The platform''s band test holds the mart''s Amazon row inside the window band in both directions (regen plan U13).'
  history: 'Registered 2026-10-12 at -0.89% (band -5.9% to +4.1%) on A3.01''s unrolled $2.10, with a landed figure at the flat $2.61 (-6.6%), which DECISIONS#A3.01-period forbids; restated the same day on A3.29''s roll and the P&L''s indexed landed cost.'
