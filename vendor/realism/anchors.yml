  value: 'UNFI AND KeHE, where the mechanism is published and the threshold is not. UNFI''s Supplier Terms and Conditions
    carry it - and THE DOCUMENT IS DATED AFTER THE WINDOW IT IS APPLIED TO, last updated 2026-07-30 against an effective_to
    of 2025-12-31. The structure of these terms is long-standing and the sections cited are not new, but that the
    2023-2025 text was identical is an ASSUMPTION and no row registers it. Same shape as the four benchmark-vintage
    dating rows already tracked. The sections: section 6a a 6-month GUARANTEED SALE on new products per DC; 6b the
    supplier refunds all unsold inventory of products UNFI deems "no longer commercially viable", and on termination;
    4a.iv at least 75% of shelf life remaining at receipt; 5a.ii 90 days'' notice on price changes; 5e deductions
    taken net and billed if not deductible within 30 days; 4a.iii UNFI may cancel any order if the supplier fails
    to make progress. THE MECHANISM IS TIER A MATERIAL AND THE ROW IS TIER B, because its operative THRESHOLD is
    not published: an item below 1 case per DC per week over 13 weeks is treated as no longer commercially viable
    (owner-signed practitioner), triggering DC-level discontinuation with the remaining inventory refunded by the
    supplier. THAT REFUND IS NOT A NEW FEE LINE - it is a deduction of A4.05''s damaged/unsaleables type, and registering
    it separately would double-count the pool. Shelf life below 75% at receipt is refused or deducted. Deductions
    net, billed after 30 days. KeHE: fill 98 with a 3% fee on shorted value (A5.15), the same DC-discontinuation
    shape, quarterly DC item review. THE COUNT DERIVES, RESTATED 2026-09-14 ON A5.38''S UNITS (ruled). Each distributor''s
    units are its A5.38 dollars over A3.04''s price, split across A5.32''s DCs and over the SKUs it still carries,
    in proportion to velocity. A catalogue drawn at A10.16''s sigma of 0.941 carries 18.85 SKU-DC pairs below the
    floor at its first review - a START-UP ARTIFACT: the distributors discontinued those pairs in the year before
    the window, and the window opens without them. IN THE WINDOW, with launches and A2.09''s decliners and A11.26''s
    brand-side pruning (A11.21), 6.47 / 2.54 / 3.25 pairs are discontinued, 12.26 in all, summed unrounded, persistent
    - a pair gone stays gone; 0.78 of them a seed belong to SKUs leaving the catalogue in the same quarter, and
    the two levels are not summed. THE COUNT FELL WHEN A11.26 LANDED (2026-09-16): a size the brand discontinues
    takes its live pairs with it, so fewer pairs remain to fail the floor later, and more of the pairs that do go,
    go with their SKU. A11.26 IS NAMED HERE, NOT DEPENDED ON: this row feeds A11.21''s draw, which A11.26 acts inside,
    so an edge back would close a cycle the gate blocks (the convention at DECISIONS#A11.21-second-rulings). THIS
    FLOOR IS COUPLED TO THE RUN FLOOR: a SKU cut at a DC loses that DC''s volume, which is the leg that keeps the
    tail above A5.29''s two minimum runs a year, so A10.06 and A10.09''s catalogue exits are one mechanism and are
    derived together. CROSS-NOTE FOR A3.22: UNFI''s 90-day price-change notice means a January list increase must
    be noticed by October, which A3.22 carries for Walmart and not for UNFI.'
