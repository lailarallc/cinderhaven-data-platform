  value: 'Deduction DOLLAR-CONCENTRATION curve, the mapping from a count filing rate to a dollar filing rate that
    A4.06 states three rates without. DEDUCTION AMOUNTS ARE A MIXTURE OF PER-TYPE LOG-NORMALS - not one log-normal,
    RULED 2026-09-21 (DECISIONS#A9.19-is-a-mixture). The one-line simplification was the first registration''s,
    and this row''s own derivation overtook it the day A10.17''s within-type bands arrived: a mixture of log-normals
    is not log-normal, and the curve below is the mixture''s. THE MEAN DERIVES, $350.3 SINCE A10.17''s RESTATEMENT OF 2026-10-13: A10.17 registers the per-type mean amounts, and the overall mean is 1 / sum(A4.05 share_t / A10.17
    mean_t) - a figure that depends on the type means alone and is robust to whatever within-type bands are registered
    later. SIGMA IS DERIVED, 0.8937, AND THE HOLD IS LIFTED - AND FROM 2026-09-21 IT IS A SUMMARY STATISTIC OF THE
    MIXTURE AND NOT AN INPUT TO THE CURVE. A10.17 registers each type''s p10-p90 band, so each type is log-normal
    at its signed mean with a within-type sigma of ln(p90/p10) / 2.563, weighted by its share of deduction COUNT.
    The mixture''s median, solved on its CDF, is $235.0 and its sigma sqrt(2 ln(350.3 / 235.0)) = 0.8937 - just below the 0.9-1.0 the owner expected, which it sat inside until A10.17 moved its three out-of-band means into their bands. The between-type floor is now 0.041: with those means inside their bands, the count-median type''s mean sits almost at the overall mean, so the floor no longer bounds anything and sigma is the mixture''s alone. ON THE MIXTURE, the registered model from 2026-09-21, the dollar filing rates are 34.6 / 28.7 / 26.4%. Share of dollars in the top q of deductions
    BY COUNT is the MIXTURE''S OWN: solve the mixture CDF for the count cut, then sum each type''s mean above it
    by weight. The largest half carries 81.2% of dollars, the largest tenth 37.8%. The exact mixture gives 0.345924 at y1, and the gate''s draw check holds the closed form against a 300,000-draw simulation every run (DECISIONS#closed-form-carries-a-draw). FILING ORDER: largest-first regardless
    of validity (how one person works a queue), so a count filing rate q files share(q) of dollars, overall and
    on bucket 1 alike - the clerk files by size, not by validity. The curve is the primitive; A9.06 applies it to
    its own count rates and carries the dollar rates and A4.08''s current series. The generator draws deduction
    amounts from this distribution within A4.05''s type ranges and files the queue largest-first; every filing rate
    is then an OUTPUT.'
  history: 'Mean deduction (A9.19): the earlier $600 was attributed to ''A4.05''s dollar-weighted mean'' and could
    not be recomputed, because A4.05 carries dollar SHARES and not per-type amounts; it was RESTATED 2026-09-12
    to $377.6. Mean deduction (A9.19): the earlier $600 was a free input with a derivation''s wording, and the derived
