  two_endpoint: false
  unit: usd-curve
  denominator: annual certification fee, $, by gross organic sales tier and handler class; cost-share as share of
    allowable cost with a $ cap
  value: 'THE CALENDAR AND WHAT IT COSTS. ORGANIC, on Oregon Tilth''s schedule effective 2026-01-01: the annual
    fee is tiered by gross organic sales and split by class - Processor/Handler RETAIL for an operation that makes
    its own product, WHOLESALE for a brand owner whose organic sales are more than half co-packed. $5.5-10M: $9,000
    retail, $5,000 wholesale; $10-15M: $12,000 and $7,000; $15-20M: $14,000 and $10,000. Inspection $72 an hour,
    travel $45 an hour plus expenses; $300 a year for each facility listed under one master certificate, the first
    included; renewal due 1 January or 1 April; late or missing responses up to $50 each; 18% a year on invoices
    past 90 days; first-year applicants $300. The schedule was read through a text-extraction proxy that loses table
    layout, so the column assignment is to be confirmed. 2026 CHANGES, NOT WINDOW VALUES: Tilth''s announcement
    of 2025-11-06 lists a cancelled-inspection fee raised from $100 to $500, EU fees, reinstatement after suspension
    raised - the 2026 schedule prints $1,500 - resellers moved to the Wholesale class and 365-day sales periods.
    The rule that an inspection falls no later than 18 months after the last is in the 2026 schedule, not in the
    September 2024 Procedures Manual and not in the announcement, so whether it governed the window is unread. THE
    WINDOW''S SCHEDULES WERE NOT REACHED, and A1.07''s Do-not rejects applying a value whose effective date postdates
    the window, so the 2026 tiers stand in for 2023-2025 only by ruling. RULED TIER A ON ORGANIC; DRAFTED B for
    that reason, AND THE DRAFTING HOLDS (owner, 2026-09-15, item 8): this row stays Tier B for the window, and the
    reason its 2026 tiers may be read back is TILTH''S OWN STATEMENT THAT IT KEEPS FEES STABLE - the schedule this
    row already cites, OTCO Fee Schedule rev. 2026/01/01, carries it on PAGE 3, in the Welcome section, on "maintaining
    stable certification fees". The 2026-09-15 check recorded that no source read carried the statement; it is in
    the cited source, so NOTHING IS OWED for it. A1.07''s Do-not still holds - the statement is a reason to read
    the tiers back, not a licence to apply a 2026 effective date inside the window. U14 reaches only Tier A and
    two-endpoint rows, so promotion needs the window''s schedules read by the owner''s pass, not U14''s. WHICH TIER
    AND WHICH CLASS turn on quantities no row holds: A2.18 carries organic on ~20% of SKUs by COUNT, and the co-packed
    share of organic sales is not registered; with the count share standing in for sales ($6.50M, $8.12M and $9.34M)
    the tier is $5.5-10M in every year, and with the catalogue''s in-house share of SKUs, 26 of A2.01''s 39 non-club
    SKUs, two in three, standing in for the organic lines'' mode - as it does for A11.08''s kettle lots - co-packed
    sales are under half, so the RETAIL class applies. USDA FSA OCCSP (government): 75% of allowable cost up to
    $750 per category - crops, wild crops, livestock, processing/handling, and State Organic Program fees in California
    only - in program years 2023, 2024 and 2025, paid first come, first served; program years run October to September
    and 2025''s applications opened 2026-07-02, so no 2025 reimbursement lands in the window; funding runs through
    fiscal 2031. OTHER CERTIFICATIONS: Non-GMO Project $115 a product a year from 2025-08-01, with earlier price
    sheets from 2022 ($105) and 2021 ($70) and none dated January 2023 to July 2025, plus a technical administrator''s
    evaluation (SCS, July 2025: $2,000 for up to five products, $110 each after); GFCO by headcount, risk and plants
    - a 10-49-employee company at 1-5 plants pays $2,180, $3,030 or $4,240 by risk tier, audits $1,500, $1,210 per
    brand-owner and co-manufacturer pairing - on a schedule amended 2024-11-11, so earlier window years are unread;
    SQF site registration $650 per code, $800 for two or more, in effect as of 2024-04-01 with earlier fees not
    found, certification-body audit fees quote-only, recertification within 30 days of the anniversary, one unannounced
    audit in three years, and Edition 9 governing the window; KOSHER fees are not published by OU, OK Kosher or
    Star-K. Renewal is annual for organic, Non-GMO, GFCO and SQF, and OK Kosher''s certificate runs a year. THE
    LAPSE IS NOT YET GENERABLE: the ruling generates it from the cadence as a missed renewal in the A9.06 clerk''s
    queue - A9.04''s one AR, deductions and order-entry clerk, whose hours A9.06 allocates - and the queue''s miss
