  status: decided
  owner: shawn
  two_endpoint: false
  unit: ratio
  denominator: launches gone from the catalogue by 24 months / launches observed for 24 months; delisted listings
    / listings; catalogue exits per window year
  value: 'THE LAUNCH LIFECYCLE, ON THE OWNER''S RULINGS OF 2026-09-14 (DECISIONS#A11.21) AS AMENDED THE SAME DAY
    (#A11.21-second-rulings, #A2.09-decline, #sigma-within-set). NOTHING IS SOLVED AGAINST A SURVIVAL TARGET: the
    one solve is the account factor''s, against A7.03''s spread less its door and week components (A11.27, A11.28).
    Both free inputs are owner-signed: no launch decay, LAMBDA 0 - the floors, A10.18''s cuts and selection noise
    already remove a little more than the published share, and decay beside them would count one failure twice -
    and the launch forecast error, SIGMA_PRED 0.60 (A11.23). THE MECHANISM: a launch leaves the catalogue only through
    registered floors - A7.13''s 90-day bars; A7.12''s floors, Kroger''s 60 on two consecutive reviews, Whole Foods''
    50 at the 90-day check and Walmart''s bottom quintile at each reset; A10.18''s one-in-one-out cuts, after which
    a launch is no longer carried at that account; A10.06''s DC floor once the guaranteed sale ends; A5.29''s run
    floor on the recipe; A11.24, which discontinues a launch no national account carries; and A10.03''s breach chain (owner, 2026-10-14, DECISIONS#u18-rulings Q4), at its any-pair odds a window year, delisting Walmart''s lowest-velocity carried SKU at the next modular reset 0-6 months after stage 4. UNITS FOLLOW A5.38''S
    DOLLARS over A3.04''s realized price, account by account, and a SKU''s velocity at an account is its catalogue
    multiplier times an account factor retailers cannot forecast. THE TARGET IS NOT A7.03''S 0.941. That figure
    is measured over door-SKU-weeks, and an account review reads account-averaged velocity, where door and week
    variation average out (ruled 2026-09-15). The door component (A11.27, 0.55) and the week component (A11.28,
    0.30) come out first, leaving 0.702 as what a carried set spreads AT THE ACCOUNT. THE ACCOUNT FACTOR''S LOG-SD
    SOLVES TO 0.57 ON THE WINDOW''S OWN y3 CARRIED SETS - launches, cuts and decline included, the population the
    owner ruled on 2026-09-14 - which then spread 0.70; it is printed, not signed. On the window-start catalogue
    alone it solves to 0.44, and at that value the window''s own sets spread 0.64 - the reading the ruling''s ''about
    0.79'' was measured on. Group 10''s generator reads the factor from this draw, so A10.04''s, A10.06''s,
    A10.09''s and A10.16''s figures read an A11.21 output; the registry records the edge one way, into this row
    (#sigma-within-set). THE CATALOGUE MULTIPLIER IS A10.16''S 0.941, PINNED BY A5.28 READ AS A BOUND, and the pin
    holds on the multiplier, not on the volume it generates. With runs a year scaling as the square root of volume,
    the multiplier at 0.941 gives an A:C cadence of 2.86 : 1 and C items at 3.5 runs a year, inside A5.28''s 3-4,
    where a sigma of 2.0 would give 11.2 : 1 and 0.89 runs; A5.28''s midpoint, A 10 : C 3.5, reads as 0.941 and
    its widest, A 12 : C 3, as 1.223. ON GENERATED IN-HOUSE RECIPE VOLUME the same rule gives 4.42 : 1 at 0.941
    and C recipes at 2.3 runs a year, outside A5.28''s 3-4; A5.28''s widest is met at a catalogue sigma of 0.81
    and its midpoint at 0.25, the factor held. That reads A5.28 as a cap; the package has read cadence as censored
    by the minimum run, the true spread at least as wide as cadence implies (DECISIONS#A10.16 and DECISIONS#A10.09-exits),
    and read that way A5.28 is a floor that generated volume does not breach. Both readings go back to the owner.
    WHAT DERIVES, over 6,000 seeded trials printed by scripts/group11_compliance.py, which reproduces group 10''s
    window start before extending it and checks seven invariants in every quarter of every trial: 33% OF LAUNCHES
    ARE GONE FROM THE CATALOGUE BY TWO YEARS, over the 6.75 launches a seed observes, 31% at sigma_pred 0.50 and
    35% at 0.70 with the account factor held - against A11.20''s branded 29%, and inside the category''s 12-42%.
    A7.13 DERIVES AT 52% at the ninety-day check - Walmart 47, Kroger 64, Whole Foods 46 - and 59% of listings delisted
    or cut within two years; 2022''s launches, their 2022 quarters judged on the expected environment, give 45%
    and 57%, and the window''s, on the draw, 55% and 60%. IN-WINDOW CATALOGUE EXITS 1.17 / 4.17 / 2.76 = 8.09: 2022''s
    launches 0.40 / 0.10 / 0.07; the window''s launches 0.62 / 1.13 / 1.40; A2.09''s at-risk SKUs 0.03 / 0.01 /
    0.01 and fading SKUs 0.04 / 0.02 / 0.03; other mature sizes culled with their recipe 0.08 / 0.00 / 0.00, 0.03
    of them beside a declining recipe-mate and none of them carried by a retailer in the quarter it left; A11.26''s
    brand-side pruning 0.00 / 2.91 / 1.25; club packs 0.00 / 0.00 / 0.00; components are rounded. EVERY LAUNCH EXIT
    comes through A11.24, 3.72 a seed, and none through the run floor or A11.26. 2022''s cohort loses 0.49 before
    the window. R4: exits per seed have a 10th percentile of 5, a median of 8 and a mean of 8.09, so a seed passes
    at 5 or more. A1.10 DERIVES: A7.09''s launches and Costco''s two club packs, 3.00 / 3.00 / 5.00, less those
    exits = net 1.83 / -1.17 / 2.24 SKUs a year, the catalogue shrinking in y2, the year A11.26''s first cycle clears
    the standing tail. THE MATURE SET: its hazard in the draw is 0.4 / 8.1 / 3.9% a year against IRI''s 11.9-14.1%
    (A11.20), and 0.40 / 0.15 / 0.26% with A11.26 off - A5.29''s floor binds the recipe, and a declining size''s
    recipe sells many times its two minimum runs, so A2.09''s decliners leave through the brand''s own rule rather
    than the floor. A10.18 COMPARED: its cuts in the draw are 12.71 over nine launches from y1, 2.09 of them on
    launches, against the 14 it registers for the six after y1; in the draw a launch cuts only when its account''s
    set is full, so one that fills a vacancy a delist left cuts nothing. READINGS the rules rest on, listed in the
    generator: the account factor solved on the window''s own y3 carried sets; launches in 3 of each year''s 4 quarters,
    2022 included, chosen at random; every authorized door at the three launch accounts from launch, a draft, since
    A7.09 says 2-4 accounts and then spread; a launch taking an open slot - A7.26''s growth or a vacancy a delist
    left - before a cut; a window launch as its own recipe, and 2022''s survivors each taking a size slot of its
    production mode in group 2''s map; reviews counted from launch - month 3, then month 9 and every six months;
    Walmart delisting at the first strike; Whole Foods reviewing a launch only at 90 days; the catalogue check quarterly
    from month 6, a draft; UNFI''s six-month guaranteed sale applied to KeHE, a draft; account floors not applied
    to mature sizes inside the draw; 2022 on y1''s doors, units and velocities, with no cuts, and its launches pooled
    with the window''s in A7.13''s shares; the window opening on 39 sizes whose recipes clear the run floor, culled
    sizes redrawn in their slots; A2.09''s decliners drawn at random among the mature sizes; an exit counted by
    the size that leaves, so a size culled with a declining recipe-mate is not a decline; a cut ending a listing
    in A7.13''s two-year share; runs a year scaling with the square root of volume behind A5.28''s bound; every
    modelled exit meeting R4''s run-and-submission criterion, RECIPE-CULLED SIZES INCLUDED as a third kind of exit
