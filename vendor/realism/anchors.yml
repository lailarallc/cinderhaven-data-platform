  value: 'LAUNCH FORECAST ERROR, SIGMA_PRED - the error on the forecast a retailer selects a launch on at A7.10''s
    40% acceptance, as a log-scale standard deviation. Selection on forecast used A5.25''s mature-item error; a
    launch is forecast worse, and the ruling registers its error as its own input (owner, 2026-09-14). THE VALUE
    IS OWNER-SIGNED: 0.60 (#A11.21-second-rulings), within the band of 0.50-0.70 signed the same day, and it is
    not to be lowered to reproduce A11.20''s 29%. On the generator''s conversion 0.60 is a MAPE of 54%, and the
    band is 43-66%. The ruling''s words ''MAPE about 50%'' round that down, and its ''IBF new-product MAPE 40-60%''
    is sigma 0.47-0.65, which starts below the band and stops short of its top. PLAUSIBILITY, AS READ: no IBF material
    reached gives 40-60% - the wording appears in an uncited vendor blog of 2026. Kahn''s by-type figures, as his
    2014 and 2015 decks present his survey, put accuracy one year after launch at 63% for line extensions, 54% for
    new uses and markets, 47% for new category entries and 40% for new-to-the-world products; the 2002 JPIM abstract
    gives only 58% for all types. IBF''s summary of its Research Report 17 (2017) gives 64% error for completely
    new products and 35-36% for improvements and market extensions. On a median-unbiased log-normal error, MAPE
    37% is sigma 0.44, 46% is 0.53, 53% is 0.59 and 60% is 0.65. So the band runs from just below new uses and markets
    to past new-to-the-world products; 0.60 sits at new category entries, and line extensions'' published error,
    near 0.44, lies below the band. At 0.50 and 0.70 A11.21 prints 30.8% and 34.5% of launches gone by 24 months,
    the account factor held. OWED: which kind of launch A7.09''s launches are.'
  source_url: null
  source_date: null
  figure: null
  measured: Owner-signed 2026-09-14; plausibility from Kahn's survey as his decks present it and IBF Research Report
    17's public summary (2017); the conversion from MAPE assumes a median-unbiased multiplicative error
