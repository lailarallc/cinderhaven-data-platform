  value: 'SKU-LEVEL VELOCITY DISPERSION - the catalogue multiplier, log-normal across the 39-SKU window-start catalogue
    (A2.01, restated), SIGMA = 0.941, READ FROM A7.03 rather than inferred, and pinned there by A5.28''s cadence
    read as a bound (#sigma-within-set). Read as a cap, the bound holds on the multiplier, 2.86 : 1, and not on
    the in-house recipe volume the catalogue generates, 4.42 : 1 (A11.21); read as censored, as the rationale below
    reads cadence, it is a floor that volume does not breach. Which reading holds is with the owner. THE CATALOGUE-SIGMA
    / FACTOR SPLIT IS SIGNED ON PLAUSIBILITY, AND THE ALTERNATIVE IS PRINTED (owner, 2026-09-14, third rulings 2):
    with A5.28''s cap withdrawn, no registered row pins the split, so it is a decision - catalogue 0.941, the factor
    solved. THE ALTERNATIVE IS CATALOGUE SIGMA 2.0 WITH NO FACTOR AT ALL: it spreads the carried sets 0.949 and
    culls 8.7 sizes at the first draw against this reading''s 0.179 - which is why it is not taken. Its plausibility
    fails on its own terms as well: at 2.0 the 90th-percentile SKU sells 168 times the 10th and the top decile''s
    mean runs about 1,480 times the bottom decile''s, where 0.941 gives 11.2 and 28, and no specialty catalogue
    shows the former. A7.03 registers the distribution directly: a 2.97 u/s/w mean in y3 with a top quintile of
    6-10. The top-quintile mean of a log-normal is m x Phi(sigma - z_0.8) / 0.2, so a quintile midpoint of 8 pins
    sigma, and it reproduces A7.03''s tail band as a check (bottom quintile 0.55, inside 0.3-0.8). It passes the
    package''s >=10x velocity-spread gate. WHY NOT RUN CADENCE: A5.28''s A:C cadence of 2.86:1 is CENSORED by the minimum economic run - a slow SKU is held to a few runs a year however little it sells - so it compresses velocity at exactly the tail this row sizes. THE AUTHORIZATION RULE: a retailer authorizes at item setup, before velocity exists, ranking
    on a FORECAST that carries A5.25''s error (SKU-month MAPE 38 / 41.5 / 45% -> multiplicative sigma 0.446 / 0.482
    / 0.517) and measuring ACTUALS at review. Authorization is STICKY - A7.26''s counts grow, so an item is authorized
    once and kept until a floor removes it. 0.941 IS THE SPREAD WITHIN A CARRIED SET (ruled 2026-09-14): A7.03 measures
    door-SKU-weeks, which are carried SKUs at doors. BUT NOT THE SPREAD AT THE ACCOUNT: door-SKU-weeks pool store
    and week variation with the SKU''s own, and an account review reads account-averaged velocity. The door component
    (A11.27, 0.55) and the week component (A11.28, 0.30) come out first (ruled 2026-09-15), leaving 0.702 at the
    account. A SKU x account factor retailers cannot forecast carries what the catalogue multiplier leaves; its
    log-sd solves to 0.57 on the window''s own y3 carried sets - launches, cuts and decline included, group 11''s
    draw - which then spread 0.70; on group 10''s catalogue with no launches the log velocity at the account spreads
    0.76 at Walmart, 0.79 at Kroger and 0.82 at Whole Foods at window start, and 0.82 at Sprouts at its y2 opening.
    On the window-start catalogue alone the factor would solve to 0.44, the reading the ruling''s ''about 0.79''
    was measured on; the owner ruled the window''s own sets the population on 2026-09-14. The factor is read from
    group 11''s draw, so this row''s delists read an A11.21 output; the registry records the edge one way, into
    A11.21 (#sigma-within-set). WHAT DERIVES, seeded draw: a SKU''s velocity index at an account is the brand index
    times its velocity there over the mean of the set the account carries. Kroger authorized SKUs below A7.12''s
    floor of 60 give 9.893 delists over the window; Walmart''s bottom quintile of the modular computes to index
    29.1 at the door-SKU-week sigma of 0.941 derived from A7.03 - if the category carries that spread, which no row registers - and gives
    2.165. TOTAL 12.058 FLOOR DELISTS. WALMART IS REMOVED AT THE FIRST RESET as A7.12 says, not the second (corrected
    2026-09-16: the two-consecutive test had been run for both accounts, and group 11''s launch rules already read
    the quintile as one strike). THE PRE-PERIOD''S REVIEW IS SIMULATED (owner, 2026-09-15, item 4): 2022 is reviewed first, on y1''s index and counts. Its own delists, 0.00
    / 0.85 / 0.85 for Kroger, Walmart and both, fall OUTSIDE the window - not window exits, not R4''s (item 2) -
    and the strikes it carries into y1 are 4.69 / 0.00 / 4.69. Before this, the window opened with every strike
    count at zero and nothing could leave until the second in-window review. THE DRAW IS ITS OWN: it runs on the
    window-start catalogue with no launches, and no account floor feeds A10.09''s catalogue exits. THESE ARE ACCOUNT-LEVEL - a SKU leaving one shelf. They are not R4''s exit gate, which counts SKUs
    leaving the catalogue, derived in A10.09 and A11.21.'
  history: 'A10.16''s first version derived sigma = 0.4784 from A5.28''s A:C cadence of 2.86:1; that value failed the package''s >=10x velocity-spread gate and was replaced by 0.941, read from A7.03. A10.16''s floor-delist count was 7.014 before the pre-period''s review was simulated (owner, 2026-09-15, item 4), which is most of why it moved to the present 12.058. A10.16''s floor-delist count without the account factor was 5.304, and before it 0.785 on a volume model that broke A7.03''s identity; both are superseded by 12.058.'
